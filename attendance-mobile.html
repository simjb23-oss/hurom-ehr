<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>EHR 근태 신청 시안 v0.2 (모바일 390)</title>
<style>
:root{--brand:#004123;--brand-50:#E9F1EC;--brand-line:#B9CFC2;--ivory:#FDF7EC;--ink:#1F2328;--sub:#5B6470;--mute:#98A1AC;--line:#E8E1D4;--card:#FFFFFF;
--done:#1E8E3E;--done-50:#E6F6EA;--wait:#9A5B00;--wait-50:#FFF1D9;--no:#B42318;--no-50:#FDECEA;
--cancel:#5B6470;--cancel-50:#EEF0F2;--change:#2457A6;--change-50:#E8F0FB;--retro:#6B3FA0;--retro-50:#F3EAFB}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI","맑은 고딕","Malgun Gothic",sans-serif;color:var(--ink);background:var(--ivory)}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.st.w{background:var(--wait-50);color:var(--wait)}.st.o{background:var(--done-50);color:var(--done)}.st.n{background:var(--no-50);color:var(--no)}
.st.c{background:var(--cancel-50);color:var(--cancel)}.st.ch{background:var(--change-50);color:var(--change)}.st.r{background:var(--retro-50);color:var(--retro)}
.tagx{display:inline-block;font-size:10px;padding:0 6px;border-radius:4px;border:1px solid var(--brand-line);color:var(--brand);margin-left:4px;font-weight:600}
.btn{display:inline-block;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;text-align:center}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.no{color:var(--no);border-color:#F1B8B2}
.btn.dis{opacity:.4}.btn.ghost{color:var(--sub)}
.fld{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff}
.fld.auto{border-color:var(--brand-line);background:#F4F8F5}
.fld.auto:after{content:"자동 채움";float:right;font-size:10px;color:var(--brand);margin-top:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg span{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;background:#fff}
.seg .on{border-color:var(--brand);background:var(--brand-50);color:var(--brand);font-weight:600}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:13px}
.me{margin-left:auto;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.ag{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}.ag small{display:block;color:var(--sub);font-size:11px}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal div{background:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.bal small{color:var(--sub);font-size:11px;display:block}.bal b{font-size:16px}
.hint{font-size:11px;color:var(--sub);margin:6px 0 12px;text-align:right}
.line{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.step{padding:3px 9px;border-radius:12px;background:var(--ivory);border:1px solid var(--line);color:var(--sub)}.step.cur{background:var(--brand-50);border-color:var(--brand-line);color:var(--brand);font-weight:600}
.tl{font-size:12px;border-left:2px solid var(--line);margin:0 0 0 6px;padding-left:12px}
.tl p{margin:0 0 6px;position:relative}.tl p:before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.reno{display:inline-block;font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;font-weight:600;background:#fff}
.orig{display:block;font-size:11px;color:var(--brand);margin-top:2px}
.tl p.d:before{background:var(--done)}.tl p.c:before{background:var(--brand)}
body{width:390px}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.bar b{font-size:16px}.bar .back{font-size:18px;color:var(--sub)}.bar .demo{margin-left:auto;font-size:10px;background:var(--wait-50);color:var(--wait);padding:2px 7px;border-radius:10px;font-weight:600}
.wrap{padding:14px 16px}
.chat{margin-bottom:14px}
.lb{font-size:12px;color:var(--sub);margin:12px 0 6px}
.seg span{padding:8px 14px;font-size:13px}.seg{gap:8px}
.fld{padding:10px 12px;font-size:14px}
.bal{margin-top:16px}
.line{margin-bottom:6px}
.cta{display:flex;gap:8px;margin:16px 0 8px}.cta .btn{flex:1;padding:12px;font-size:15px}
.sec{font-size:15px;font-weight:700;margin:22px 0 10px;padding-top:16px;border-top:8px solid #F3EDE2;margin-left:-16px;margin-right:-16px;padding-left:16px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.item .t{display:flex;justify-content:space-between;align-items:center}.item .t b{font-size:14px}
.item .s{font-size:12px;color:var(--sub);margin:4px 0 10px}
.item .btn{width:100%;padding:9px}
.foot{font-size:10px;color:var(--mute);padding:8px 16px 16px}
</style></head><body>
<div class="bar"><span class="back">—</span><b>—</b><span class="demo">화면 틀 · 데이터 없음</span></div>
<div class="wrap">
<div class="chat">
<div class="msg me">—</div>
<div class="msg ag"><small>EHR 에이전트</small>—<b>—</b>—</div>
</div>
<div class="lb">—</div><div class="seg"><span>—</span><span class="on">—</span></div>
<div class="seg"><span>—</span><span class="on">—</span></div>
<div class="fld auto">—</div>
<div class="fld auto">—</div>
<div class="bal"><div><small>잔여</small><b style="color:var(--brand)">—</b></div><div><small>예약</small><b style="color:var(--wait)">—</b></div><div><small>사용</small><b>—</b></div></div>
<div class="hint">—<b>—</b>—<br/>—</div>
<div class="line"><span class="step cur">—</span>→<span class="step">—</span>→<span class="step">—</span>→<span class="step">—</span></div>
<div class="cta"><span class="btn ghost">고치기</span><span class="btn p">신청</span></div>
<div class="sec">내 신청</div>
<div class="item" style="border-color:#F1B8B2"><div class="t"><b>—</b><span class="st n">반려</span></div><div class="s">—<br/><span style="color:var(--ink)">—</span></div><span class="btn p">다시 신청</span></div>
<div class="item"><div class="t"><b>—</b><span class="st o">확정 완료</span></div><div class="s">—</div><span class="btn">취소 요청</span></div>
<div class="item"><div class="t"><b>—</b><span class="st w">팀장 대기</span></div><div class="s">—</div><div style="display:flex;gap:8px"><span class="btn">취소 요청</span></div></div>
<div class="item"><div class="t"><b>—</b><span><span class="st r">소급</span> <span class="st w">인사 대기</span></span></div><div class="s">—</div></div>
</div>
<div class="foot">—</div>
</body></html>
