      <div class="foot"><span class="hint">새 연결은 [변동사항 · 인원 배치]에서 새 부서 카드의 “기존 줄에 합치기”로 만듭니다.</span></div></div>`;
    return html;
  }
  function orgSplits() {
    const s = state, cfg = s.cfg;
    let html = `<div class="panel flat"><div class="panel-head"><h2>임원 · 겸직 배분</h2><span class="hint s">한 사람의 급여·상조회비를 여러 부서 줄로 나눕니다. 둘째 부서부터 원 단위를 버리고 끝전은 첫 부서로 갑니다.</span></div>`;
    if (!cfg.splits.length) html += `<div style="padding:16px 18px" class="hint">등록된 배분이 없습니다.</div>`;
    cfg.splits.forEach(sp => {
      const p = personOf(sp.id), code = sp.branch || (p && p.siteCode) || cfg.branches[0].code, b = branchByCode(code), ab = allocBranch(code);
      const det = ab && (ab.splits.find(x => x.person.id === sp.id) || {}).detail;
      let body = '';
      if (sp.mode === 'headcount') {
        const adj = sp.adj || {}, ex = sp.exclude || [];
        const names = [...new Set([...(b ? b.centers : []), ...(ab ? ab.centers.map(c => c.name) : []), ...Object.keys(adj)])];
        const base = n => { const c = ab && ab.centers.find(x => x.name === n); return c ? c.count : 0; };
        const tot = C.sum(names.filter(n => !ex.includes(n)), n => Math.max(0, base(n) + (adj[n] || 0)));
        body = `<div class="hint s" style="margin-bottom:8px">${h(b ? b.name : '')}의 모든 전표 줄에 직원 수 비율로 나눕니다(새 부서가 생기면 자동 포함). 합계 ${tot}명 기준.${Object.keys(adj).length ? ` <b>보정 ${Object.keys(adj).length}곳</b>은 기존 엑셀 결과와 맞추려고 넣은 값입니다. <button class="btn sm" data-act="clearAdj" data-id="${h(sp.id)}">보정 모두 지우고 실제 인원만 쓰기</button>` : ''}</div>
          <div class="tbl-wrap" style="max-height:340px"><table class="grid"><tr><th>포함</th><th>활동센터</th><th class="num">직원 수</th><th class="num">보정(±)</th><th class="num">배분 기준</th><th>비율</th></tr>`
          + names.map(n => { const on = !ex.includes(n), w = on ? Math.max(0, base(n) + (adj[n] || 0)) : 0; return `<tr><td class="c"><input type="checkbox" data-chg="exclude" data-id="${h(sp.id)}" data-n="${h(n)}" ${on ? 'checked' : ''}></td><td>${h(n)}</td><td class="num">${ab ? base(n) : '-'}</td><td class="num"><input type="text" class="adj" value="${adj[n] || ''}" placeholder="0" data-chg="adj" data-id="${h(sp.id)}" data-n="${h(n)}" style="width:56px;text-align:right"></td><td class="num">${w}</td><td><div class="bar"><i style="width:${tot ? (w / tot * 100).toFixed(1) : 0}%"></i></div></td></tr>`; }).join('') + `</table></div>`;
      } else {
        const names = centerNames(code), tot = Math.round(C.sum(sp.parts || [], x => C.NUM(x.pct)) * 100) / 100;
        body = `<div class="parts">` + (sp.parts || []).map((x, i) => `<div class="part"><select data-chg="partCenter" data-id="${h(sp.id)}" data-i="${i}" style="width:220px"><option value="">부서 고르기</option>${opts(names.includes(x.center) || !x.center ? names : [x.center, ...names], x.center)}</select>
            <input type="text" class="pct" value="${x.pct}" data-chg="partPct" data-id="${h(sp.id)}" data-i="${i}"> %<div class="bar"><i style="width:${Math.min(100, C.NUM(x.pct))}%"></i></div>${i === 0 ? '<span class="hint s">끝전 받는 부서</span>' : ''}<span style="flex:1"></span><button class="btn sm ghost danger" data-act="delPart" data-id="${h(sp.id)}" data-i="${i}">빼기</button></div>`).join('')
          + `</div><div class="row" style="display:flex;gap:8px;align-items:center;margin-top:10px"><button class="btn sm" data-act="addPart" data-id="${h(sp.id)}">부서 추가</button><button class="btn sm" data-act="evenParts" data-id="${h(sp.id)}">똑같이 나누기</button><span class="chip ${tot === 100 ? 'ok' : 'warn'}">합계 ${tot}%</span></div>`;
      }
      html += `<div class="rule"><div><b style="font-size:15px">${h(sp.name)}</b><div class="hint s">${p ? `${h(p.title || '직책 없음')} · 대장 부서 ${h(p.dept)} · ${h(b ? b.name : '')}` : (s.cur ? '<span class="chip warn">이번 대장에 없음</span>' : h(b ? b.name : ''))}</div>
        <div style="margin-top:10px"><select data-chg="splitMode" data-id="${h(sp.id)}"><option value="ratio" ${sp.mode !== 'headcount' ? 'selected' : ''}>부서별 비율 지정</option><option value="headcount" ${sp.mode === 'headcount' ? 'selected' : ''}>사업장 전체에 인원수 비례</option></select></div>
        <div style="margin-top:8px"><button class="btn sm ghost danger" data-act="delSplit" data-id="${h(sp.id)}">배분 없애기</button></div></div><div>${body}</div></div>`;
    });
    html += `<div class="foot"><span class="hint">새로 나눌 사람은 [변동사항 · 인원 배치]에서 그 사람의 전표 줄을 “여러 부서로 나누기…”로 바꾸면 여기에 생깁니다.</span></div></div>`;
    return html;
  }
  function orgManual() {
    const s = state, cfg = s.cfg;
    const brSel = (i, m) => `<select data-chg="manual" data-i="${i}" data-k="branch">${cfg.branches.map(b => `<option value="${b.code}" ${m.branch === b.code ? 'selected' : ''}>${h(b.name)}</option>`).join('')}</select>`;
    const sj = cfg.manual.map((m, i) => [m, i]).filter(([m]) => m.type === 'sangjo'), vo = cfg.manual.map((m, i) => [m, i]).filter(([m]) => m.type === 'voucher');
    let html = `<div class="panel flat"><div class="panel-head"><h2>상조회비 회사 찬조 추가분</h2><span class="hint s">급여에서 공제하지 않지만 회사가 상조회에 내는 금액. 상조회비 전표와 기안서 “회사찬조금”에 더해집니다.</span></div>
      <div class="tbl-wrap"><table class="grid"><tr><th>사업장</th><th>활동센터</th><th class="num">금액</th><th>사유 (기안서 비고에 표시)</th><th>매월</th><th></th></tr>`
      + (sj.map(([m, i]) => `<tr><td>${brSel(i, m)}</td><td><select data-chg="manual" data-i="${i}" data-k="center"><option value="">고르기</option>${opts(centerNames(m.branch).includes(m.center) || !m.center ? centerNames(m.branch) : [m.center, ...centerNames(m.branch)], m.center)}</select></td><td class="num"><input type="text" value="${won(m.amount)}" data-chg="manual" data-i="${i}" data-k="amount" style="width:110px;text-align:right"></td><td><input type="text" value="${h(m.memo || '')}" data-chg="manual" data-i="${i}" data-k="memo" style="width:100%;min-width:260px"></td><td class="c"><input type="checkbox" data-chg="manual" data-i="${i}" data-k="repeat" ${m.repeat ? 'checked' : ''}></td><td><button class="btn sm ghost danger" data-act="delManual" data-i="${i}">지우기</button></td></tr>`).join('') || `<tr><td colspan="6" class="hint">없습니다.</td></tr>`)
      + `</table></div><div class="foot"><button class="btn" data-act="addManual" data-k="sangjo">추가분 넣기</button></div></div>`;
    html += `<div class="panel flat"><div class="panel-head"><h2>급여전표 수기 행</h2><span class="hint s">대장에 없는 줄(세액보전액, 휴가지원사업 부담금 등). 넣은 만큼 미지급비용이 달라집니다.</span></div>
      <div class="tbl-wrap"><table class="grid"><tr><th>사업장</th><th>차·대</th><th>계정과목</th><th class="num">금액</th><th>적요 (앞에 “○월 급여(사업장)”이 붙습니다)</th><th>매월</th><th></th></tr>`
      + (vo.map(([m, i]) => `<tr><td>${brSel(i, m)}</td><td><select data-chg="manual" data-i="${i}" data-k="side"><option ${m.side !== '차변' ? 'selected' : ''}>대변</option><option ${m.side === '차변' ? 'selected' : ''}>차변</option></select></td><td><input type="text" value="${h(m.account || '')}" data-chg="manual" data-i="${i}" data-k="account" style="width:130px"></td><td class="num"><input type="text" value="${won(m.amount)}" data-chg="manual" data-i="${i}" data-k="amount" style="width:110px;text-align:right"></td><td><input type="text" value="${h(m.memo || '')}" data-chg="manual" data-i="${i}" data-k="memo" style="width:100%;min-width:260px"></td><td class="c"><input type="checkbox" data-chg="manual" data-i="${i}" data-k="repeat" ${m.repeat ? 'checked' : ''}></td><td><button class="btn sm ghost danger" data-act="delManual" data-i="${i}">지우기</button></td></tr>`).join('') || `<tr><td colspan="7" class="hint">없습니다. 매월 체크를 끄면 지금 올린 달에만 들어갑니다.</td></tr>`)
      + `</table></div><div class="foot"><button class="btn" data-act="addManual" data-k="voucher">수기 행 넣기</button></div></div>`;
    html += `<div class="panel flat"><div class="panel-head"><h2>예수금 줄</h2><span class="hint s">대장의 공제 열 → 전표 대변 줄. {지점} {세무서} {구청}은 사업장 정보로 바뀝니다. 금액 0원인 줄은 빠집니다.</span></div>
      <div class="tbl-wrap"><table class="grid"><tr><th>순서</th><th>계정과목</th><th>적요</th><th>대장의 공제 열</th></tr>`
      + cfg.credits.map((c, i) => `<tr><td class="mono">${i + 1}</td><td>${h(c.account || '예수금')}</td><td><input type="text" value="${h(c.label)}" data-chg="creditLabel" data-i="${i}" style="width:100%;min-width:320px"></td><td class="hint s">${h((c.cols || []).join(' + '))}${c.check ? ' <span class="chip warn">생기면 확인 알림</span>' : ''}</td></tr>`).join('')
      + `</table></div><div class="foot"><label class="field">귀속부서<input type="text" value="${h(cfg.owner || '')}" data-chg="cfgField" data-k="owner" style="width:160px"></label><span class="hint">대장에 새 공제 열이 생기면 예수금 줄을 임시로 만들고 알려 드립니다.</span></div></div>`;
    return html;
  }

  // ───────── 화면: 월별 이력 ─────────
  function histTable(year, curYm, editable) {
    const H = state.cfg.history, lay = C.monthlyLayout(H, year);
    const months = []; for (let m = 1; m <= 12; m++) months.push(`${year}-${String(m).padStart(2, '0')}`);
    const cols = months.map(k => C.monthColumn(H, k, lay));
    const cell = (ym, k, v, i) => {
      if (!editable) return `<td class="num ${ym === curYm ? 'cur' : ''}" style="padding:4px 10px">${cols[i] ? won(v) : ''}</td>`;
      const adj = H[ym] && H[ym].adj && H[ym].adj[k];
      return `<td class="${ym === curYm ? 'cur' : ''}"><input type="text" class="${adj ? 'adj' : ''}" value="${cols[i] ? won(v) : ''}" data-chg="hist" data-ym="${ym}" data-k="${h(k)}" ${adj ? `title="대장 값 ${won(v - adj)}에 수기 ${adj > 0 ? '+' : ''}${won(adj)}"` : ''}></td>`;
    };
    const row = (label, k) => `<tr><td class="lab">${h(label)}</td>${months.map((ym, i) => cell(ym, k, cols[i] ? (k === 'heads' ? cols[i].heads : cols[i].v(k)) : 0, i)).join('')}<td class="num" style="padding:4px 10px">${k === 'heads' ? (cols.filter(Boolean).length ? (C.sum(cols.filter(Boolean), c => c.heads) / cols.filter(Boolean).length).toFixed(1) : '') : won(C.sum(cols.filter(Boolean), c => c.v(k)))}</td></tr>`;
    const sub = (label, f) => `<tr class="sum"><td class="lab" style="background:#F7F8FA">${label}</td>${cols.map(c => `<td class="num">${c ? won(f(c)) : ''}</td>`).join('')}<td class="num">${won(C.sum(cols.filter(Boolean), f))}</td></tr>`;
    return `<div class="tbl-wrap"><table class="grid hist"><tr><th>구분</th>${months.map(ym => `<th class="num">${year.slice(2)}.${ym.slice(5)}${ym === curYm ? ' (당월)' : ''}</th>`).join('')}<th class="num">연계</th></tr>`
      + row('지급인원', 'heads') + lay.pay.map(k => row(C.keyLabel(k), k)).join('') + sub('지급 소계', c => c.pay) + lay.ded.map(k => row(C.keyLabel(k), k)).join('') + sub('공제 소계', c => c.ded) + sub('실지급액', c => c.net) + `</table></div>`;
  }
  function viewHistory() {
    const s = state, H = s.cfg.history;
    const years = [...new Set([...Object.keys(H).map(k => k.slice(0, 4)), String(new Date().getFullYear()), ...(s.cur ? [s.cur.month.slice(0, 4)] : [])])].sort();
    if (!s.histYear || !years.includes(s.histYear)) s.histYear = s.cur ? s.cur.month.slice(0, 4) : years[years.length - 1];
    const adjMonths = Object.keys(H).filter(k => k.startsWith(s.histYear) && H[k].adj && Object.keys(H[k].adj).length);
    return `<h1>월별 이력</h1><p class="lead">기안 엑셀의 월별 표와 지난 해 참고 시트는 여기 쌓인 값으로 만듭니다. 급여대장을 올리면 그 달 값이 자동으로 들어가고, 해가 바뀌면 새 해 표가 시작되며 지난 해는 참고 시트로 넘어갑니다.</p>
      <div class="panel flat"><div class="panel-head"><div class="tabs">${years.map(y => `<button class="tab ${s.histYear === y ? 'on' : ''}" data-act="histYear" data-y="${y}">${y}년</button>`).join('')}</div><span class="sp"></span><span class="hint s">칸을 고치면 대장 값과의 차이를 수기 가감으로 기억합니다(노란 칸).</span></div>
      ${histTable(s.histYear, s.cur && s.cur.kind === '급여' ? s.cur.month : null, true)}
      ${adjMonths.length ? `<div class="foot"><span class="hint">수기 가감이 있는 달:</span>${adjMonths.map(k => `<button class="btn sm" data-act="clearHistAdj" data-ym="${k}">${k} 가감 지우기</button>`).join('')}</div>` : ''}</div>`;
  }

  // ───────── 셸 ─────────
  const MODULES = [];
  function registerModule(m) { MODULES.push(m); }
  registerModule({ id: 'home', group: '', title: '대장 등록', icon: 'home', render: viewHome });
  registerModule({ id: 'voucher', group: '급여 마감', title: '급여전표', icon: 'voucher', render: viewVoucher });
  registerModule({ id: 'memo', group: '급여 마감', title: '급여기안', icon: 'memo', render: viewMemo });
  registerModule({ id: 'org', group: '설정', title: '조직·배분', icon: 'org', render: viewOrg, dot: () => !!(state.alloc && (state.alloc.branches.some(b => b.newCenters.length) || state.alloc.unknownSites.length)) });
  registerModule({ id: 'history', group: '설정', title: '월별 이력', icon: 'history', render: viewHistory });

  function render() {
    const s = state, mod = MODULES.find(m => m.id === s.view) || MODULES[0];
    const keep = document.activeElement && document.activeElement.id === 'pq' ? document.activeElement.value : null;
    let nav = '', lastGroup = null;
    MODULES.forEach(m => { if (m.group !== lastGroup) { if (m.group) nav += `<div class="nav-group">${h(m.group)}</div>`; lastGroup = m.group; } nav += `<button class="nav ${m.id === mod.id ? 'on' : ''}" data-act="go" data-v="${m.id}"><svg viewBox="0 0 24 24">${ICON[m.icon] || ''}</svg>${h(m.title)}${m.dot && m.dot() ? '<span class="dot" title="확인할 것이 있습니다"></span>' : ''}</button>`; });
    const saved = s.savedNow || EMBED.savedAt || '';
    let body = '';
    try { body = mod.render(); } catch (e) { body = `<div class="errbox">화면을 그리는 중 오류가 났습니다: ${h(e.message)}\n${h(String(e.stack || '').split('\n').slice(1, 4).join('\n'))}</div>`; }
    $('#app').innerHTML = `<div class="app"><aside class="side"><div class="brand"><b>Hurom LS</b><span>급여작업 지원 앱</span></div>${nav}
      <div class="side-foot">${VERSION} · 최종수정 ${h(BUILT)}<br>설정 저장 ${saved ? h(saved) : '기본값(초안)'}<br><button class="btn sm ghost" data-act="exportCfg" style="padding-left:0">설정 내보내기</button><button class="btn sm ghost" data-act="importCfg">불러오기</button></div></aside>
      <main class="main"><div class="top"><span class="crumb">${mod.group ? h(mod.group) + ' / ' : ''}<b>${h(mod.title)}</b></span>${s.cur ? `<span class="chip acc">${C.ymLabel(s.cur.month)} ${h(s.cur.kind)}</span>` : ''}<span class="sp"></span>
      ${s.dirty ? `<span class="chip warn" title="저장하지 않고 창을 닫으면 사라집니다.">저장하지 않은 변경이 있습니다</span><button class="btn sm ghost" data-act="discardLocal">변경 취소</button>` : ''}<button class="btn ${s.dirty ? 'pri' : ''}" data-act="saveApp">설정 넣어 앱 파일 저장</button></div>
      ${s.error && mod.id !== 'home' ? `<div class="errbox">${h(s.error)}</div>` : ''}<div id="view">${body}</div></main></div>
      <input type="file" id="file" class="hide" multiple accept=".xls,.xlsx,.xlsm,.csv"><input type="file" id="cfgfile" class="hide" accept=".json">`;
    if (keep != null) { const q = $('#pq'); if (q) { q.value = keep; filterPeople(); } }
  }
  function filterPeople() { const q = ($('#pq').value || '').trim().toLowerCase(); document.querySelectorAll('#ptbl tr[data-q]').forEach(tr => tr.classList.toggle('hide', !!q && !tr.dataset.q.includes(q))); }

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    const f = ACT[el.dataset.act]; if (!f) return;
    try { const r = f(el.dataset, el); if (r && r.catch) r.catch(e => { state.error = '오류: ' + e.message; render(); }); } catch (e) { state.error = '오류: ' + e.message; render(); }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'file') { if (t.files.length) addFiles([...t.files]); return; }
    if (t.id === 'cfgfile') { const f = t.files[0]; if (!f) return; f.text().then(txt => { try { const c = JSON.parse(txt); if (!c.branches) throw new Error('설정 파일이 아닙니다.'); state.cfg = normalizeCfg(c); changed(); toast('설정을 불러왔습니다.'); } catch (e) { toast('불러오지 못했습니다: ' + e.message); } }); return; }
    const el = t.closest('[data-chg]'); if (!el) return;
    const f = CHG[el.dataset.chg]; if (!f) return;
    try { f(el.dataset, el.value, el); } catch (e) { state.error = '오류: ' + e.message; render(); }
  });
  document.addEventListener('input', ev => { if (ev.target.id === 'pq') filterPeople(); });
  document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.id === 'drop') { ev.preventDefault(); $('#file').click(); } if (ev.key === 'Enter' && ev.target.id === 'newCenter') { const b = document.querySelector('[data-act="addCenter"]'); if (b) b.click(); } });
  ['dragenter', 'dragover'].forEach(n => window.addEventListener(n, ev => { ev.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => window.addEventListener(n, ev => { ev.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); }));
  window.addEventListener('drop', ev => { const fs = ev.dataTransfer && ev.dataTransfer.files; if (fs && fs.length) { state.view = 'home'; addFiles([...fs]); } });

  window.addEventListener('beforeunload', ev => { if (state.dirty) { ev.preventDefault(); ev.returnValue = ''; } });
  window.LSApp = { state, registerModule, render, recalc, addFiles, buildAppFile, version: VERSION };
  render();
})();
</script>
</body></html>
