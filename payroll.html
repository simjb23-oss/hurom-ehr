<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-HR 급여작업 (급여대장 → 전표·기안)</title>
<style id="ls-css">:root{
  --bg:#f7f4ec; --surface:#fff; --ink:#1B2430; --muted:#5C6877; --faint:#8A95A3; --line:#DDE2E9; --line-soft:#EBEEF3;
  --accent:#1f6b45; --accent-ink:#164f33; --accent-soft:#e8f2ec;
  --ok:#2C7A57; --ok-soft:#E2F1E9; --warn:#8F5E06; --warn-soft:#FBF0D9; --err:#B03A2A; --err-soft:#FAE6E2;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,'IBM Plex Sans KR','Malgun Gothic','맑은 고딕',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
/* 사이드바 */
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 18px}
.brand b{display:block;font-size:19px;letter-spacing:-.01em;color:var(--accent-ink)}
.brand span{color:var(--muted);font-size:12.5px}
.nav-group{margin:14px 8px 4px;font-size:12px;color:var(--faint)}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink)}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
/* 본문 */
.main{min-width:0;padding:0 32px 60px}
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}
.crumb{color:var(--muted)} .crumb b{color:var(--ink)}
.top .sp{flex:1}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 4px;font-weight:700}
h2{font-size:16px;margin:0 0 10px;font-weight:650;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 8px;font-weight:650}
.lead{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.panel.flat{padding:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.panel-head h2{margin:0} .panel-head .sp{flex:1}
.hint{color:var(--muted);font-size:13px} .hint.s{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#B9C2CE;background:#FAFBFC}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)} .btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.err{background:var(--err-soft);color:var(--err)} .chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
/* 올리기 */
.drop{border:1.5px dashed #B7C2D1;border-radius:var(--r);background:var(--surface);padding:30px 24px;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop b{font-size:16px;display:block;margin-bottom:4px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px} .slots.two{grid-template-columns:1fr 1fr}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:86px}
.slot.empty{border-style:dashed;background:none;color:var(--muted)}
.slot .t{font-size:12.5px;color:var(--muted)} .slot .m{font-size:17px;font-weight:650;margin:1px 0}
.slot .f{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 대조 띠 */
.recon{width:100%;border-collapse:collapse}
.recon th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 14px;border-bottom:1px solid var(--line-soft)}
.recon th:first-child,.recon td:first-child{text-align:left}
.recon td{padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.recon tr:last-child td{border-bottom:0}
.recon .eq{color:var(--faint);padding:0 2px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.todo li:last-child{border-bottom:0}
.todo .mk{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warn)} .todo .mk.i{background:var(--accent)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-weight:700}
.step b{display:block} .step span{color:var(--muted);font-size:13px}
/* 표 */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.tbl-wrap{overflow:auto}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
.grid th{position:sticky;top:0;background:#F7F8FA;font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;color:var(--muted)}
.grid td{padding:7px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid tr.new td{background:#FFFBF0} .grid tr.sum td{font-weight:650;background:#F7F8FA}
.grid td.c,.grid th.c{text-align:center} .grid th.num{text-align:right}
.grid .mono{font-variant-numeric:tabular-nums;color:var(--muted)}
.foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line-soft);background:#FAFBFC}
details.more{border-top:1px solid var(--line-soft)} details.more>summary{cursor:pointer;padding:12px 18px;color:var(--accent-ink);font-weight:600;list-style-position:inside}

.doc table{border-collapse:collapse;width:100%;margin:6px 0 20px;font-size:13.5px}
.doc th{background:#ECEFF3;font-weight:600;border:1px solid #C9D0DA;padding:6px 10px;text-align:center}
.doc td{border:1px solid #C9D0DA;padding:6px 10px;vertical-align:middle}
.doc td.c{text-align:center} .doc td.inc{background:#E4F0DC;text-align:center} .doc td.dec{background:#FBF0CC;text-align:center}
.doc tr.b td{font-weight:650} .doc tr.sub td:not(.inc):not(.dec){background:#F1F3F6;font-weight:650} .doc .neg{color:var(--err)}
.doc textarea{border-color:transparent;background:#FBFCFD;font-size:13px;min-height:42px} .doc textarea:hover{border-color:var(--line)}
/* 설정 */
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.card.warn{border-color:#E9CF93;background:#FFFCF3}
.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .row+.row{margin-top:8px}
.card b.nm{font-size:15px}
.rule{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.rule:last-child{border-bottom:0}
.parts{display:grid;gap:6px}
.part{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.part input.pct{width:72px;text-align:right} .part input.adj{width:58px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;width:120px} .bar>i{display:block;height:100%;background:var(--accent)}
.order{display:flex;gap:2px}
.order button{border:1px solid var(--line);background:#fff;width:24px;height:24px;border-radius:6px;cursor:pointer;line-height:1;padding:0;color:var(--muted)}
.order button:hover{color:var(--ink);border-color:#B9C2CE}
.field{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)} .field input{color:var(--ink);font-size:14px}
.fields{display:flex;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.hist td{padding:2px 4px} .hist input{width:104px;text-align:right;border-color:transparent;padding:3px 6px;font-variant-numeric:tabular-nums;font-size:13px}
.hist input:hover{border-color:var(--line)} .hist input.adj{background:var(--warn-soft)} .hist td.cur input{background:#FFF7DD} .hist td.lab{padding:4px 10px;white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1}

.toast.on{opacity:1}
.hide{display:none!important}

  // aoa: 시트 전체를 2차원 배열로. 머리글 이름으로 열을 찾으므로 열이 늘거나 순서가 바뀌어도 된다.
  const ID_COLS = ['귀속년월', '구분', '사번', '성명', '입사구분', '직위', '직책', '직종', '사업장코드', '사업장명', '원가구분',
    '상위부서', '부서코드', '부서명', '입사일', '퇴사일', '급여형태'];

  function parseLedger(aoa, fileName) {
    const warnings = [];
    let hi = -1;
    for (let i = 0; i < Math.min(aoa.length, 30); i++) {
      const h = (aoa[i] || []).map(normH);
      if (h.includes('사번') && h.includes('성명')) { hi = i; break; }
    }
    if (hi < 0) throw new Error('급여대장 머리글(사번·성명)을 찾지 못했습니다. ERP에서 내려받은 급여대장 파일이 맞는지 확인하세요.');
    const headers = (aoa[hi] || []).map(normH);
    const col = name => headers.indexOf(name);
    const need = ['사번', '성명', '사업장코드', '부서명', '지급계', '실지급계'];
    const miss = need.filter(n => col(n) < 0);
    if (miss.length) throw new Error('급여대장에 필요한 열이 없습니다: ' + miss.join(', '));

    const iGross = col('지급계'), iDed = col('공제계'), iNet = col('실지급계');
    let iPayStart = col('기본급');
    if (iPayStart < 0) iPayStart = Math.max(...ID_COLS.map(col)) + 1;
    const payCols = [], dedCols = [], extraCols = [];
    headers.forEach((h, i) => {
      if (!h) return;
      if (i >= iPayStart && i < iGross) payCols.push(h);
      else if (iDed >= 0 && i > iGross && i < iDed) dedCols.push(h);
      else if (iDed < 0 && i > iGross && i < iNet) dedCols.push(h);
      else if (i > iNet && h !== '비고') extraCols.push(h);
    });
    const numCols = [...payCols, '지급계', ...dedCols, '공제계', '실지급계', ...extraCols].filter(h => col(h) >= 0);

    const people = []; let totals = null; const months = {}, kinds = {};
    for (let r = hi + 1; r < aoa.length; r++) {
      const row = aoa[r] || [];
      const first = normH(row[0]);
      if (first === '합계' || normH(row[col('성명')]) === '합계') {
        totals = {}; numCols.forEach(h => { totals[h] = NUM(row[col(h)]); }); continue;
      }
      const id = clean(row[col('사번')]), name = clean(row[col('성명')]);
      if (!id && !name) continue;
      const g = n => (col(n) >= 0 ? clean(row[col(n)]) : '');
      const v = {}; numCols.forEach(h => { v[h] = NUM(row[col(h)]); });
      const ded = iDed >= 0 ? v['공제계'] : sum(dedCols, h => v[h]);
      const ym = toYm(row[col('귀속년월')]); if (ym) months[ym] = (months[ym] || 0) + 1;
      const kind = g('구분') || '급여'; kinds[kind] = (kinds[kind] || 0) + 1;
      people.push({
        id: id || name, name, kind, title: g('직책'), pos: g('직위'), jobType: g('직종'),
        siteCode: g('사업장코드'), siteName: g('사업장명'), upper: g('상위부서'), deptCode: g('부서코드'), dept: g('부서명'),
        joined: col('입사일') >= 0 ? toDateStr(row[col('입사일')]) : '', left: col('퇴사일') >= 0 ? toDateStr(row[col('퇴사일')]) : '',
        payType: g('급여형태'), v, gross: v['지급계'], ded, net: v['실지급계'],
      });
    }
    if (!people.length) throw new Error('급여대장에서 사람 줄을 찾지 못했습니다.');
    const top = o => Object.keys(o).sort((a, b) => o[b] - o[a])[0] || '';
    const month = top(months), kind = top(kinds);
    if (!month) warnings.push('귀속년월을 읽지 못했습니다. 파일의 귀속년월 열을 확인하세요.');
    if (Object.keys(months).length > 1) warnings.push('귀속년월이 여러 달 섞여 있습니다: ' + Object.keys(months).join(', '));
    if (totals) {
      const g = sum(people, p => p.gross), n = sum(people, p => p.net);
      if (g !== totals['지급계'] || n !== totals['실지급계']) warnings.push(`사람별 합계가 대장의 합계 줄과 다릅니다 (지급계 ${g.toLocaleString()} / 합계 줄 ${totals['지급계'].toLocaleString()}).`);
    }
    people.forEach(p => { p.active = !(p.gross === 0 && p.ded === 0 && p.net === 0); });
    return { fileName: fileName || '', month, kind, people, headers: headers.filter(Boolean), payCols, dedCols, extraCols, totals, warnings };
  }

  // ───────── 2. 활동센터 정하기 + 임원 배분 ─────────
  function branchOf(cfg, p) {
    let b = cfg.branches.find(x => x.code === p.siteCode);
    return b || null;
  }
  // 한 사람이 전표의 어느 줄(활동센터)로 가는지: ① 임원 배분 ② 사람별 지정 ③ 부서 연결 ④ 대장의 부서명 그대로
  function resolvePerson(cfg, p) {
    const split = (cfg.splits || []).find(s => s.id === p.id) || (cfg.splits || []).find(s => !s.id && s.name === p.name);
    if (split) return { via: 'split', split };
    const pc = (cfg.people || []).find(s => s.id === p.id) || (cfg.people || []).find(s => !s.id && s.name === p.name);
    if (pc && pc.center) return { via: 'person', center: pc.center };
    const dm = (cfg.deptMap || []).find(d => d.dept === p.dept && (!d.branch || d.branch === p.siteCode));
    if (dm && dm.center) return { via: 'deptMap', center: dm.center };
    return { via: 'dept', center: p.dept || '(부서 없음)' };
  }

  // 금액을 가중치대로 나눔: 둘째부터 원 단위 버림, 끝전은 첫째로 (기존 엑셀과 같은 방식)
  function allocate(amount, weights, mode) {
    const n = weights.length; if (!n) return [];
    const parts = new Array(n).fill(0);
    if (mode === 'headcount') {
      const total = sum(weights);
      const per = total ? Math.trunc(amount / total) : 0;
      for (let i = 0; i < n; i++) parts[i] = per * weights[i];
    } else { // ratio: weights 는 퍼센트(소수 둘째 자리까지)
      for (let i = 0; i < n; i++) parts[i] = Math.trunc(amount * Math.round(weights[i] * 100) / 10000);
    }
    let hold = weights.findIndex(w => w > 0); if (hold < 0) hold = 0;
    let others = 0; for (let i = 0; i < n; i++) if (i !== hold) others += parts[i];
    parts[hold] = amount - others;
    return parts;
  }

  function buildAllocation(ledger, cfg) {
    const warnings = [], notices = [];
    const out = { branches: [], unknownSites: [], warnings, notices };
    const byBranch = new Map();
    cfg.branches.forEach(b => byBranch.set(b.code, { cfg: b, people: [], centers: new Map(), splits: [], order: [], newCenters: [] }));
    const unknown = new Map();
    for (const p of ledger.people) {
      if (!p.active) continue;
      const b = branchOf(cfg, p);
      if (!b) { const k = p.siteCode || '(코드 없음)'; if (!unknown.has(k)) unknown.set(k, { code: k, name: p.upper || p.siteName, count: 0, gross: 0 }); const u = unknown.get(k); u.count++; u.gross += p.gross; continue; }
      byBranch.get(b.code).people.push(p);
    }
    out.unknownSites = [...unknown.values()];
    out.unknownSites.forEach(u => warnings.push(`대장에 설정에 없는 사업장(${u.code} ${u.name || ''})이 있습니다. ${u.count}명, ${u.gross.toLocaleString()}원이 전표에서 빠져 있습니다 — [조직·배분 설정]에서 사업장을 추가하세요.`));

    for (const [code, B] of byBranch) {
      const b = B.cfg;
      const cen = name => { if (!B.centers.has(name)) B.centers.set(name, { name, pay: 0, sangjo: 0, count: 0, members: [], shares: [] }); return B.centers.get(name); };
      const pending = [];
      for (const p of B.people) {
        const r = resolvePerson(cfg, p); p._res = r;
        if (r.via === 'split') { pending.push({ p, split: r.split }); continue; }
        const c = cen(r.center); c.pay += p.gross; c.sangjo += NUM(p.v['상조회']); c.count++; c.members.push(p);
      }
      const ordered = () => {
        const names = [...B.centers.keys()];
        const known = (b.centers || []).filter(n => B.centers.has(n));
        const fresh = names.filter(n => !(b.centers || []).includes(n));
        return [...known, ...fresh];
      };
      // 직원 수(임원 배분 대상 제외)는 여기서 확정
      const headBase = new Map([...B.centers].map(([k, c]) => [k, c.count]));
      for (const { p, split } of pending) {
        let targets = [], weights = [], mode = split.mode === 'headcount' ? 'headcount' : 'ratio';
        if (mode === 'headcount') {
          const adj = split.adj || {}, ex = split.exclude || [];
          const names = [...new Set([...(b.centers || []), ...headBase.keys(), ...Object.keys(adj)])];
          for (const n of names) {
            if (ex.includes(n)) continue;
            const w = (headBase.get(n) || 0) + NUM(adj[n]);
            if (w > 0) { targets.push(n); weights.push(w); }
          }
          if (!targets.length) { warnings.push(`${b.name} ${p.name}: 인원수 기준으로 나눌 부서가 없습니다. 급여가 '${p.dept}' 줄로 들어갑니다.`); targets = [p.dept]; weights = [1]; }
        } else {
          const parts = (split.parts || []).filter(x => x.center);
          targets = parts.map(x => x.center); weights = parts.map(x => NUM(x.pct));
          const tot = Math.round(sum(weights) * 100) / 100;
          if (!targets.length) { warnings.push(`${b.name} ${p.name}: 배분 부서가 비어 있습니다. 급여가 '${p.dept}' 줄로 들어갑니다.`); targets = [p.dept]; weights = [100]; }
          else if (tot !== 100) warnings.push(`${b.name} ${p.name}: 배분 비율 합계가 ${tot}%입니다 (100%가 아니면 남는 금액이 첫 부서 '${targets[0]}'로 들어갑니다).`);
        }
        const pay = allocate(p.gross, weights, mode), sj = allocate(NUM(p.v['상조회']), weights, mode);
        const detail = targets.map((n, i) => ({ center: n, weight: weights[i], pay: pay[i], sangjo: sj[i] }));
        detail.forEach(d => { const c = cen(d.center); c.pay += d.pay; c.sangjo += d.sangjo; c.shares.push({ from: p.name, pay: d.pay, sangjo: d.sangjo, weight: d.weight }); });
        B.splits.push({ person: p, mode, detail });
      }
      B.order = ordered();
      B.newCenters = B.order.filter(n => !(b.centers || []).includes(n));
      B.idle = (b.centers || []).filter(n => !B.centers.has(n));
      out.branches.push({ code, name: b.name, short: b.short || b.name, cfg: b, people: B.people, centers: B.order.map(n => B.centers.get(n)), newCenters: B.newCenters, idleCenters: B.idle, splits: B.splits });
    }

    // 설정에 남아 있지만 이번 대장에 없는 것들 (퇴사·조직 변경 흔적)
    const act = new Map(ledger.people.filter(p => p.active).map(p => [p.id, p]));
    (cfg.splits || []).forEach(s => { if (!act.has(s.id)) notices.push({ type: 'split-missing', id: s.id, name: s.name, text: `임원 배분에 등록된 ${s.name} 님이 이번 대장에 없습니다(또는 지급액 0원).` }); });
    (cfg.people || []).forEach(s => { if (!act.has(s.id)) notices.push({ type: 'person-missing', id: s.id, name: s.name, text: `사람별 지정에 등록된 ${s.name} 님이 이번 대장에 없습니다(또는 지급액 0원).` }); });
    const depts = new Set(ledger.people.filter(p => p.active).map(p => p.siteCode + '|' + p.dept));
    (cfg.deptMap || []).forEach(d => { if (![...depts].some(k => k.endsWith('|' + d.dept) && (!d.branch || k.startsWith(d.branch + '|')))) notices.push({ type: 'dept-missing', dept: d.dept, text: `부서 연결에 등록된 '${d.dept}'가 이번 대장에 없습니다.` }); });
    return out;
  }

  // ───────── 3. 급여전표 · 상조회비 전표 ─────────
  function fillLabel(tpl, b) {
    return String(tpl).replace(/\{지점\}/g, b.name).replace(/\{세무서\}/g, b.taxOffice || '').replace(/\{구청\}/g, b.cityOffice || '').replace(/\s+/g, ' ').trim();
  }

  function buildVouchers(ledger, cfg, alloc) {
    alloc = alloc || buildAllocation(ledger, cfg);
    const D = cfg.defaults || {};
    const isBonus = ledger.kind && ledger.kind !== '급여';
    const kindLabel = ledger.kind || '급여';
    const ym = ymLabel(ledger.month || '0000-00');
    const owner = cfg.owner || '';
    const warnings = [...alloc.warnings];
    const covered = new Set(); (cfg.credits || []).forEach(c => (c.cols || []).forEach(x => covered.add(x)));
    const res = { month: ledger.month, kind: kindLabel, isBonus, branches: [], sangjo: [], warnings, alloc };
    let sjNo = 0;

    for (const B of alloc.branches) {
      const b = B.cfg, head = `${ym} ${kindLabel}(${b.name})`;
      const lines = [];
      const opt = n => (b.centerOpts && b.centerOpts[n]) || {};
      // 차변: 활동센터별 급여
      for (const c of B.centers) {
        if (c.pay === 0) continue;
        lines.push({ account: opt(c.name).account || (isBonus ? (D.bonusAccount || '상여금') : (D.account || '직원급여')), cost: opt(c.name).cost || D.cost || '판관', debit: c.pay, credit: null, memo: `${head} ${c.name}`, owner, center: c.name, isNew: B.newCenters.includes(c.name) });
      }
      // 대변: 예수금
      const credits = [];
      for (const cr of (cfg.credits || [])) {
        const amt = sum(B.people, p => sum(cr.cols || [], h => NUM(p.v[h])));
        if (amt === 0) continue;
        credits.push({ account: cr.account || '예수금', cost: '', debit: null, credit: amt, memo: `${head} ${fillLabel(cr.label, b)}`, owner, center: '', flag: cr.check ? '적요·계정과목 확인' : '' });
      }
      for (const h of ledger.dedCols) {
        if (covered.has(h)) continue;
        const amt = sum(B.people, p => NUM(p.v[h]));
        if (amt === 0) continue;
        credits.push({ account: '예수금', cost: '', debit: null, credit: amt, memo: `${head} ${h} 공제(${b.name})`, owner, center: '', flag: '새 공제 항목 — 적요·계정과목 확인' });
        warnings.push(`${b.name}: 대장에 새 공제 항목 '${h}'(${amt.toLocaleString()}원)이 있어 예수금 줄을 임시로 만들었습니다. 적요와 계정과목을 확인하세요.`);
      }
      credits.filter(c => c.flag && !c.flag.startsWith('새')).forEach(c => warnings.push(`${b.name}: '${c.memo}' ${c.credit.toLocaleString()}원 — 평소에 없던 공제입니다. 적요·계정과목을 확인하세요.`));
      // 수기 행
      const manual = (cfg.manual || []).filter(m => m.type === 'voucher' && m.branch === b.code && NUM(m.amount) !== 0 && (!m.month || m.month === ledger.month || m.repeat));
      const manualLines = manual.map(m => ({ account: m.account || '예수금', cost: m.cost || '', debit: m.side === '차변' ? NUM(m.amount) : null, credit: m.side === '차변' ? null : NUM(m.amount), memo: `${head} ${m.memo || ''}`.trim(), owner, center: m.center || '', manual: true }));
      const all = [...lines, ...credits, ...manualLines];
      const debitSum = sum(all, l => l.debit || 0), creditSum = sum(all, l => l.credit || 0);
      const accrued = debitSum - creditSum;
      all.push({ account: '미지급비용', cost: '', debit: null, credit: accrued, memo: head, owner, center: '' });
      all.forEach((l, i) => { l.no = pad3(i + 1); });
      const netSum = sum(B.people, p => p.net), grossSum = sum(B.people, p => p.gross);
      const manualNet = sum(manualLines, l => (l.credit || 0) - (l.debit || 0));
      const checks = {
        gross: grossSum, debit: sum(lines, l => l.debit), grossOk: grossSum === sum(lines, l => l.debit),
        net: netSum, accrued, netOk: accrued + manualNet === netSum, manualNet,
        heads: B.people.length,
      };
      if (!checks.grossOk) warnings.push(`${b.name}: 전표 차변 합계가 대장 지급계와 다릅니다.`);
      if (!checks.netOk) warnings.push(`${b.name}: 미지급비용(${accrued.toLocaleString()})이 대장 실지급계(${netSum.toLocaleString()})와 맞지 않습니다. 공제 항목 연결을 확인하세요.`);

      // 상조회비 전표 (회사 찬조분)
      const sjHead = `${ym} ${kindLabel} 상조회비(${b.name})`;
      const sjManual = (cfg.manual || []).filter(m => m.type === 'sangjo' && m.branch === b.code && NUM(m.amount) !== 0 && (!m.month || m.month === ledger.month || m.repeat));
      const sjLines = []; const names = B.centers.map(c => c.name);
      sjManual.forEach(m => { if (m.center && !names.includes(m.center)) names.push(m.center); });
      let sjDeduct = 0, sjExtra = 0;
      for (const n of names) {
        const c = B.centers.find(x => x.name === n);
        const base = c ? c.sangjo : 0, extra = sum(sjManual.filter(m => m.center === n), m => NUM(m.amount));
        sjDeduct += base; sjExtra += extra;
        if (base + extra === 0) continue;
        sjLines.push({ account: D.sangjoAccount || '복리후생비/상조회비', cost: opt(n).cost || D.cost || '판관', debit: base + extra, credit: null, memo: `${sjHead} ${n}`, owner, center: n, extra, extraMemo: sjManual.filter(m => m.center === n).map(m => m.memo).join(' / ') });
      }
      if (sjLines.length) {
        sjLines.push({ account: '예수금', cost: '', debit: sjDeduct, credit: null, memo: `${sjHead} 공제 상조회`, owner, center: '' });
        sjLines.push({ account: '미지급비용', cost: '', debit: null, credit: sjDeduct * 2 + sjExtra, memo: `${sjHead} 상조회`, owner, center: '' });
      }
      sjLines.forEach(l => { l.no = pad3(++sjNo); l.branch = b.code; });
      res.sangjo.push(...sjLines);
      res.branches.push({ code: b.code, name: b.name, short: b.short || b.name, lines: all, checks, newCenters: B.newCenters, idleCenters: B.idleCenters, sangjoDeduct: sjDeduct, sangjoExtra: sjExtra, sangjoCompany: sjDeduct + sjExtra, sangjoManual: sjManual });
    }
    return res;
  }

  // ───────── 4. 집계 (사업장별 표 · 월별 표 공용) ─────────
  const PAY_ROWS = [
    { k: 'base', label: '기본급', cols: ['기본급'] },
    { k: 'otFixed', label: '시간외근로수당(일반직)', cols: ['고정연장수당', '고정야간수당'] },
    { k: 'position', label: '직책수당', cols: ['직책수당'] },
    { k: 'skill', label: '기능수당', cols: ['기능수당'] },
    { k: 'family', label: '가족수당', cols: ['가족수당'] },
    { k: 'familyKid', label: '가족수당(6세이하자녀)', cols: ['가족수당(6세이하자녀)'] },
    { k: 'parent', label: '노부모수당', cols: ['노부모수당'] },
    { k: 'meal', label: '중식비', cols: ['중식비'], optional: true },
    { k: 'otExtra', label: '시간외근로수당(기타)', cols: ['추가연장수당', '휴일근무수당'] },
    { k: 'etcPay', label: '기타지급', cols: ['기타지급'] },
    { k: 'bonus', label: '연 상여금', cols: ['상여금'], siteOptional: true },
    { k: 'specialBonus', label: '특별상여금', siteLabel: 'SR 및 IB 수당', cols: ['특별상여금'] },
    { k: 'invention', label: '직무발명보상금', cols: ['직무발명보상금'] },
    { k: 'absence', label: '결근(무급)', cols: ['결근(무급)'] },
    { k: 'expat', label: '주재수당', cols: ['주재수당'] },
    { k: 'expatEdu', label: '주재수당(학자금)', cols: ['주재수당(학자금)'] },
    { k: 'taxKeep', label: '세액보전액', siteLabel: '세액보존액', cols: ['세액보존액'] },
    { k: 'cut', label: '감봉', cols: ['감봉'] },
    { k: 'prevAdj', label: '전월정산', cols: ['전월정산'] },
    { k: 'leave', label: '연차수당', cols: ['연차수당'] },
  ];
  const DED_ROWS = [
    { k: 'incomeTax', label: '소득세', cols: ['소득세'] },
    { k: 'localTax', label: '지방소득세', cols: ['주민세'] },
    { k: 'pension', label: '국민연금', cols: ['국민연금'] },
    { k: 'health', label: '건강보험', cols: ['건강보험', '장기요양보험'] },
    { k: 'employ', label: '고용보험', cols: ['고용보험'] },
    { k: 'yeTax', label: '정산 소득세', cols: ['연말정산(소득세)'] },
    { k: 'yeLocal', label: '정산 지방소득세', cols: ['연말정산(주민세)'] },
    { k: 'healthAdj', label: '정산건강보험', cols: ['건강정산'] },
    { k: 'employAdj', label: '정산고용보험', cols: ['고용정산', '정산고용보험'] },
    { k: 'midTax', label: '중도연말정산 소득세', cols: ['중도연말정산(소득세)'] },
    { k: 'midLocal', label: '중도연말정산 지방소득세', cols: ['중도연말정산(주민세)'] },
    { k: 'student', label: '학자금공제', cols: ['학자금공제'] },
    { k: 'etcDed', label: '기타공제', cols: ['기타공제', '교육비'] },
    { k: 'sangjo', label: '상조회', cols: ['상조회'] },
  ];
  // 사업장별 표의 줄 순서 (예시 엑셀과 같게)
  const SITE_PAY_ORDER = ['base', 'otFixed', 'position', 'skill', 'family', 'familyKid', 'parent', 'otExtra', 'etcPay', 'invention', 'taxKeep', 'absence', 'specialBonus', 'expat', 'expatEdu', 'cut', 'prevAdj', 'leave'];
  const SITE_DED_ORDER = ['incomeTax', 'localTax', 'yeTax', 'yeLocal', 'pension', 'health', 'employ', 'healthAdj', 'employAdj', 'midTax', 'midLocal', 'sangjo', 'student', 'etcDed'];
  const rowDef = k => PAY_ROWS.find(r => r.k === k) || DED_ROWS.find(r => r.k === k);
  const isPayKey = k => PAY_ROWS.some(r => r.k === k) || k.startsWith('xp:');
  const isDedKey = k => DED_ROWS.some(r => r.k === k) || k.startsWith('xd:');
  const keyLabel = (k, site) => { const d = rowDef(k); if (d) return (site && d.siteLabel) || d.label; return k.slice(3); };

  // 사람 목록 → { key: 합계 }. 어느 줄에도 속하지 않는 대장 열은 xp:열이름 / xd:열이름 으로 따로 모은다(소계가 대장과 맞도록).
  function aggregate(ledger, people) {
    const out = {};
    const add = (k, v) => { if (v) out[k] = (out[k] || 0) + v; };
    const payMap = {}, dedMap = {};
    PAY_ROWS.forEach(r => r.cols.forEach(c => { payMap[c] = r.k; }));
    DED_ROWS.forEach(r => r.cols.forEach(c => { dedMap[c] = r.k; }));
    for (const p of people) {
      for (const h of ledger.payCols) add(payMap[h] || ('xp:' + h), NUM(p.v[h]));
      for (const h of ledger.dedCols) add(dedMap[h] || ('xd:' + h), NUM(p.v[h]));
    }
    return out;
  }
  const paySum = o => sum(Object.keys(o).filter(isPayKey), k => o[k]);
  const dedSum = o => sum(Object.keys(o).filter(isDedKey), k => o[k]);
  function mergeAgg(a, b) { const o = Object.assign({}, a); Object.keys(b).forEach(k => { o[k] = (o[k] || 0) + b[k]; }); return o; }

  // ───────── 5. 급여기안 자료 ─────────
  function buildMemo(cur, prev, extras, cfg, vouchers) {
    extras = extras || [];
    const warnings = [];
    const branches = cfg.branches;
    const actOf = (led, code) => led ? led.people.filter(p => p.active && p.siteCode === code) : [];
    // 1) 세전금액
    const pre = branches.map(b => {
      const c = actOf(cur, b.code), p = actOf(prev, b.code);
      return { code: b.code, name: b.name, short: b.short || b.name, prevHeads: prev ? p.length : null, prevAmt: prev ? sum(p, x => x.gross) : null, curHeads: c.length, curAmt: sum(c, x => x.gross) };
    });
    const preTotal = { prevHeads: prev ? sum(pre, x => x.prevHeads) : null, prevAmt: prev ? sum(pre, x => x.prevAmt) : null, curHeads: sum(pre, x => x.curHeads), curAmt: sum(pre, x => x.curAmt) };
    // 2) 세후금액
    const post = branches.map(b => {
      const c = actOf(cur, b.code); const vb = vouchers && vouchers.branches.find(x => x.code === b.code);
      const deduct = sum(c, x => NUM(x.v['상조회'])); const extra = vb ? vb.sangjoExtra : 0;
      return { code: b.code, short: b.short || b.name, net: sum(c, x => x.net), sangjo: deduct, company: deduct + extra, extra, extraMemo: vb ? vb.sangjoManual.map(m => `(${b.short || b.name}) ${m.memo || ''}`).join('\n') : '' };
    });
    // 3) 전월대비 증감사유 (세전 지급계 기준)
    let reasons = null, personDiff = [];
    if (prev) {
      const pm = new Map(prev.people.map(p => [p.id, p])), cm = new Map(cur.people.map(p => [p.id, p]));
      const ids = [...new Set([...prev.people.map(p => p.id), ...cur.people.map(p => p.id)])];
      const firstOfPrev = (prev.month || prevYm(cur.month)) + '-01';
      const groups = { hire: [], incEtc: [], leave: [], decEtc: [] };
      for (const id of ids) {
        const a = pm.get(id), c = cm.get(id);
        const pg = a ? a.gross : 0, cg = c ? c.gross : 0, diff = cg - pg;
        const ref = c || a;
        const row = { id, name: ref.name, dept: (c && c.dept) || (a && a.dept) || '', siteCode: ref.siteCode, joined: (c && c.joined) || (a && a.joined) || '', left: (c && c.left) || (a && a.left) || '', prev: pg, cur: cg, diff, a, c };
        personDiff.push(row);
        if (diff === 0) continue;
        const isHire = row.joined && row.joined >= firstOfPrev;
        const isLeave = (row.left && row.left >= firstOfPrev) || (!c && a) || (c && !c.active && a && a.active && row.left);
        if (diff > 0) (isHire ? groups.hire : groups.incEtc).push(row);
        else (isLeave ? groups.leave : groups.decEtc).push(row);
      }
      const md = d => d ? `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}` : '';
      const hint = row => { // 가장 크게 움직인 지급 항목으로 사유 초안
        if (!row.a || !row.c) return '';
        if (row.prev === 0 && row.cur > 0) return '복직 등으로 급여 발생';
        if (row.cur === 0 && row.prev > 0) return '휴직 등으로 급여 미발생';
        const cols = [...new Set([...cur.payCols, ...prev.payCols])];
        const ds = cols.map(h => ({ h, d: NUM(row.c.v[h]) - NUM(row.a.v[h]) })).filter(x => x.d !== 0).sort((x, y) => Math.abs(y.d) - Math.abs(x.d));
        if (!ds.length) return '';
        const top = ds.slice(0, 2).map(x => `${x.h} ${x.d > 0 ? '+' : ''}${x.d.toLocaleString()}`).join(', ');
        return `${top} (사유 입력)`;
      };
      const txt = {
        hire: groups.hire.map(r => `- ${r.dept} ${displayName(r.name)} (${md(r.joined)} 입사)`).join('\n'),
        incEtc: groups.incEtc.map(r => `- ${r.dept} ${displayName(r.name)}: ${hint(r)}`).join('\n'),
        leave: groups.leave.map(r => `- ${r.dept} ${displayName(r.name)} (${r.left ? md(r.left) + ' 퇴사' : '이번 대장에 없음 · 퇴사일 확인'})`).join('\n'),
        decEtc: groups.decEtc.map(r => `- ${r.dept} ${displayName(r.name)}: ${hint(r)}`).join('\n'),
      };
      const amt = k => sum(groups[k], r => r.diff);
      reasons = { groups, amounts: { hire: amt('hire'), incEtc: amt('incEtc'), leave: amt('leave'), decEtc: amt('decEtc') }, draft: txt };
      reasons.inc = reasons.amounts.hire + reasons.amounts.incEtc; reasons.dec = reasons.amounts.leave + reasons.amounts.decEtc;
      reasons.total = reasons.inc + reasons.dec;
      reasons.ok = reasons.total === preTotal.curAmt - preTotal.prevAmt;
      if (!reasons.ok) warnings.push('증감사유 합계가 전월 대비 증감액과 다릅니다(설정에 없는 사업장 인원이 있는지 확인).');
    }
    // 4) 사업장별
    const siteAgg = branches.map(b => aggregate(cur, actOf(cur, b.code)));
    const allAgg = siteAgg.reduce(mergeAgg, {});
    const xp = Object.keys(allAgg).filter(k => k.startsWith('xp:')), xd = Object.keys(allAgg).filter(k => k.startsWith('xd:'));
    const sitePayKeys = [...SITE_PAY_ORDER, ...(allAgg.bonus ? ['bonus'] : []), ...(allAgg.meal ? ['meal'] : []), ...xp];
    const siteDedKeys = [...SITE_DED_ORDER, ...xd];
    if (xp.length || xd.length) warnings.push('대장에 표에 없던 항목이 있어 사업장별 표에 줄을 추가했습니다: ' + [...xp, ...xd].map(k => k.slice(3)).join(', '));
    const site = { payKeys: sitePayKeys, dedKeys: siteDedKeys, cols: siteAgg, heads: pre.map(x => x.curHeads) };
    // 5) 월별: 이번 달 값 (급여 + 같은 달 추가 대장)
    let monthAgg = aggregate(cur, cur.people.filter(p => p.active));
    for (const ex of extras) monthAgg = mergeAgg(monthAgg, aggregate(ex, ex.people.filter(p => p.active)));
    monthAgg.heads = preTotal.curHeads;
    return { month: cur.month, prevMonth: prev ? prev.month : prevYm(cur.month), pre, preTotal, post, reasons, personDiff, site, monthAgg, warnings, hasPrev: !!prev, extras: extras.map(e => ({ kind: e.kind, fileName: e.fileName, gross: sum(e.people, p => p.gross) })) };
  }

  // 요약 문장: "당월 지급총액 약 9.25억. 전월대비 약 1,560만원(1.7%) 증가"
  function summaryLine(preTotal) {
    const eok = (preTotal.curAmt / 1e8);
    let s = `- 당월 지급총액 약 ${eok.toFixed(2)}억.`;
    if (preTotal.prevAmt != null && preTotal.prevAmt !== 0) {
      const d = preTotal.curAmt - preTotal.prevAmt;
      const man = Math.round(Math.abs(d) / 100000) * 10; // 10만원 단위로 반올림한 만원
      const pct = Math.abs(d) / preTotal.prevAmt * 100;
      s += d === 0 ? ' 전월과 동일' : ` 전월대비 약 ${man.toLocaleString()}만원(${pct.toFixed(1)}%) ${d > 0 ? '증가' : '감소'}`;
    }
    return s;
  }

  // 월별 이력 값 읽기 (auto + 수기 가감)
  function histValue(history, ym, k) {
    const h = history && history[ym]; if (!h) return null;
    const a = (h.auto && h.auto[k]) || 0, j = (h.adj && h.adj[k]) || 0;
    let x = 0; if (h.extra) for (const kind of Object.keys(h.extra)) x += (h.extra[kind] && h.extra[kind][k]) || 0;   // 상여·성과급 대장분
    return a + j + x;
  }
  function histKeys(history, year) {
    const keys = new Set();
    for (let m = 1; m <= 12; m++) { const h = history && history[`${year}-${String(m).padStart(2, '0')}`]; if (!h) continue; Object.keys(h.auto || {}).forEach(k => keys.add(k)); Object.keys(h.adj || {}).forEach(k => keys.add(k)); Object.keys(h.extra || {}).forEach(kind => Object.keys(h.extra[kind] || {}).forEach(k => keys.add(k))); }
    return keys;
  }
  // 월별 표의 줄 구성: 기본 줄 + 그 해에 값이 있는 선택 줄
  function monthlyLayout(history, year) {
    const used = histKeys(history, year);
    const nz = k => { for (let m = 1; m <= 12; m++) { if (histValue(history, `${year}-${String(m).padStart(2, '0')}`, k)) return true; } return false; };
    const pay = PAY_ROWS.filter(r => !r.optional || nz(r.k)).map(r => r.k).concat([...used].filter(k => k.startsWith('xp:') && nz(k)));
    const ded = DED_ROWS.map(r => r.k).concat([...used].filter(k => k.startsWith('xd:') && nz(k)));
    return { pay, ded };
  }
  function monthColumn(history, ym, layout) {
    if (!history || !history[ym]) return null;
    const v = k => histValue(history, ym, k) || 0;
    const pay = sum(layout.pay, v), ded = sum(layout.ded, v);
    return { heads: v('heads'), v, pay, ded, net: pay - ded };
  }

  // 이번 달 집계를 이력에 얹은 사본 (화면·엑셀용)
  function withCurrent(history, ym, monthAgg) {
    const h = Object.assign({}, history || {});
    if (ym && monthAgg) h[ym] = { auto: monthAgg, adj: (history && history[ym] && history[ym].adj) || {}, src: '대장' };
    return h;
  }

  root.LSCore = {
    NUM, clean, normH, sum, pad3, displayName, ymLabel, ymShort, prevYm, toDateStr,
    parseLedger, resolvePerson, allocate, buildAllocation, buildVouchers,
    PAY_ROWS, DED_ROWS, SITE_PAY_ORDER, SITE_DED_ORDER, keyLabel, isPayKey, isDedKey, aggregate, paySum, dedSum, mergeAgg,
    buildMemo, summaryLine, histValue, monthlyLayout, monthColumn, withCurrent,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="ls-xlsxw">/* 서식 있는 .xlsx 를 라이브러리 없이 만드는 작은 작성기 (값·글꼴·채우기·테두리·병합·열 너비·틀 고정) */
(function (root) {
  'use strict';
  const esc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const ref = (r, c) => colName(c) + r;

  function Sheet(name, opt) { this.name = name; this.opt = opt || {}; this.rows = new Map(); this.merges = []; this.heights = {}; this.maxC = 1; this.maxR = 1; }

    if (merge !== false && (r1 !== r2 || c1 !== c2)) this.merges.push(ref(r1, c1) + ':' + ref(r2, c2)); return this;
  };

  function Book() { this.sheets = []; }
  Book.prototype.sheet = function (name, opt) { const s = new Sheet(String(name).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31), opt); this.sheets.push(s); return s; };

  const BASE_FONT = { name: '맑은 고딕', sz: 10 };
  function buildStyles(book) {
    const fonts = [], fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'], borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
    const numFmts = [], xfs = [], idx = new Map();
    const reg = (arr, xml) => { let i = arr.indexOf(xml); if (i < 0) { arr.push(xml); i = arr.length - 1; } return i; };

    const BUILTIN = { 'General': 0, '0': 1, '0.00': 2, '#,##0': 3, '#,##0.00': 4, '0%': 9, '0.00%': 10, '@': 49 };
    const styleId = s => {
      if (!s) return 0;
      const key = JSON.stringify(s); if (idx.has(key)) return idx.get(key);
      const f = reg(fonts, fontXml(s));
      const fl = s.fill ? reg(fills, `<fill><patternFill patternType="solid"><fgColor rgb="FF${s.fill}"/><bgColor indexed="64"/></patternFill></fill>`) : 0;
      let bd = 0;
      if (s.bd) { const b = typeof s.bd === 'string' ? { l: s.bd, r: s.bd, t: s.bd, b: s.bd } : s.bd; bd = reg(borders, `<border>${side('left', b.l)}${side('right', b.r)}${side('top', b.t)}${side('bottom', b.b)}<diagonal/></border>`); }
      let nf = 0;
      if (s.nf) { if (s.nf in BUILTIN) nf = BUILTIN[s.nf]; else { let i = numFmts.indexOf(s.nf); if (i < 0) { numFmts.push(s.nf); i = numFmts.length - 1; } nf = 164 + i; } }
      const al = (s.h || s.v || s.wrap) ? `<alignment${s.h ? ` horizontal="${s.h}"` : ''} vertical="${s.v || 'center'}"${s.wrap ? ' wrapText="1"' : ''}/>` : '<alignment vertical="center"/>';

      styleId,

        + `<fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders>`
        + `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
        + `<cellXfs count="${xfs.length + 1}"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center"/></xf>${xfs.join('')}</cellXfs>`
        + `<cellStyles count="1"><cellStyle name="표준" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
    };
  }

  function sheetXml(sh, st, sst) {
    const o = sh.opt, out = [];
    out.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">');
    if (o.fitWidth) out.push('<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');

      const r = 6 + i, ref = d.c || d.a, cs = { bd: T, h: 'center' };

  }

  root.LSSheets = { voucherBook, memoBook };

<script id="ls-ui">/* 휴롬엘에스 급여작업 지원 앱 — 화면 (셸 + 업무 모듈). 새 업무는 registerModule() 로 붙인다. */

  // ───────── 대장 올리기 ─────────
  async function readAoa(buf, name) { // 자체 엑셀 읽기(LSRead): 외부 라이브러리·인터넷 불필요

  async function addFiles(files) {

  async function copyText(text) {

  const VHEAD = ['행번호', '계정과목', '비용구분', '차변금액', '대변금액', '적요', '귀속부서', '활동센터'];

  function buildAppFile() { // 지금 설정을 넣은 앱 파일(HTML) 전체를 다시 조립

      + `<body data-version="${VERSION}" data-built="${BUILT}">\n<div id="app"></div><div id="toast" class="toast"></div>\n<script id="app-config" type="application/json">${json}${end}\n`

  const branchByCode = code => state.cfg.branches.find(b => b.code === code);

  function centerNames(code) { // 그 사업장에서 고를 수 있는 활동센터

    },
    dlVoucher: async () => { const bytes = await SH.voucherBook(state.v, state.cfg).bytes(); download(bytes, `${state.cfg.company} ${state.v.kind}전표 ${state.cur.month}.xlsx`, XLSX_MIME); toast('급여전표 엑셀을 내려받았습니다.'); },
    dlMemo: async () => {

      const bytes = await SH.memoBook(state.memo, { cfg: state.cfg, cur: state.cur, prev: state.prev, texts: t, postNote: t.post != null ? t.post : null, history: C.withCurrent(state.cfg.history, state.cur.kind === '급여' ? ym : null, null) }).bytes();
      download(bytes, `${state.cfg.company} ${C.ymLabel(ym)}분 급여 지출 기안서 자료.xlsx`, XLSX_MIME); toast('급여기안 엑셀을 내려받았습니다.');
    },

    saveApp: () => { const f = buildAppFile(); download(new Blob([f.page], { type: 'text/html;charset=utf-8' }), `${TITLE} ${VERSION} (설정 ${f.stamp.replace(':', '').replace(' ', ' ')}).html`); state.dirty = false; state.savedNow = f.stamp; render(); toast('설정을 넣은 앱 파일을 내려받았습니다. 다음부터는 이 파일을 여세요.'); },
    exportCfg: () => download(new Blob([JSON.stringify(state.cfg, null, 1)], { type: 'application/json' }), `휴롬엘에스 HR앱 설정 ${new Date().toISOString().slice(0, 10)}.json`),
    importCfg: () => $('#cfgfile').click(),
    discardLocal: () => { state.cfg = normalizeCfg(clone(EMBED)); state.dirty = false; recalc(); render(); toast('앱 파일에 들어 있던 설정으로 되돌렸습니다.'); },
    // 전표 줄
    acceptCenter: d => { const b = branchByCode(d.b); if (!b.centers.includes(d.n)) b.centers.push(d.n); changed(); },
    acceptAll: d => { const ab = allocBranch(d.b), b = branchByCode(d.b); ab.newCenters.forEach(n => { if (!b.centers.includes(n)) b.centers.push(n); }); changed(); },
    moveCenter: d => { const b = branchByCode(d.b), i = b.centers.indexOf(d.n), j = i + Number(d.dir); if (i < 0 || j < 0 || j >= b.centers.length) return; b.centers.splice(j, 0, b.centers.splice(i, 1)[0]); changed(); },
    delCenter: d => { const b = branchByCode(d.b); b.centers = b.centers.filter(n => n !== d.n); changed(); },
    addCenter: d => { const el = $('#newCenter'); const n = C.clean(el.value); if (!n) return; const b = branchByCode(d.b); if (!b.centers.includes(n)) b.centers.push(n); changed(); },
    addBranch: d => { const u = state.alloc.unknownSites.find(x => x.code === d.code); state.cfg.branches.push({ code: d.code, name: (u && u.name) || d.code, short: ((u && u.name) || d.code).replace(/(본사|지점)$/, ''), taxOffice: '', cityOffice: '', centers: [], centerOpts: {} }); changed(); },
    delDeptMap: d => { state.cfg.deptMap.splice(Number(d.i), 1); changed(); },
    // 임원·겸직 배분
    addSplit: d => { const p = personOf(d.id); if (!p || state.cfg.splits.some(s => s.id === p.id)) return; const r = C.resolvePerson(state.cfg, p); state.cfg.people = state.cfg.people.filter(x => x.id !== p.id); state.cfg.splits.push({ id: p.id, name: p.name, branch: p.siteCode, mode: 'ratio', parts: [{ center: r.center || p.dept, pct: 100 }] }); state.otab = 'splits'; changed(); },
    delSplit: d => { state.cfg.splits = state.cfg.splits.filter(s => s.id !== d.id); changed(); },
    addPart: d => { const s = state.cfg.splits.find(x => x.id === d.id); s.parts = s.parts || []; s.parts.push({ center: '', pct: 0 }); changed(); },
    delPart: d => { const s = state.cfg.splits.find(x => x.id === d.id); s.parts.splice(Number(d.i), 1); changed(); },
    evenParts: d => { const s = state.cfg.splits.find(x => x.id === d.id); const n = s.parts.length; if (!n) return; const each = Math.floor(10000 / n) / 100; s.parts.forEach((p, i) => { p.pct = i === 0 ? Math.round((100 - each * (n - 1)) * 100) / 100 : each; }); changed(); },
    clearAdj: d => { const s = state.cfg.splits.find(x => x.id === d.id); s.adj = {}; changed(); },
    delPerson: d => { state.cfg.people = state.cfg.people.filter(p => p.id !== d.id); changed(); },
    // 수기 행
    addManual: d => { state.cfg.manual.push(d.k === 'sangjo' ? { type: 'sangjo', branch: state.cfg.branches[0].code, center: '', amount: 0, memo: '', repeat: true } : { type: 'voucher', branch: state.cfg.branches[0].code, account: '예수금', side: '대변', amount: 0, memo: '', repeat: false, month: state.cur ? state.cur.month : '' }); changed(); },
    delManual: d => { state.cfg.manual.splice(Number(d.i), 1); changed(); },
    histYear: d => { state.histYear = d.y; render(); },
    clearHistAdj: d => { const H = state.cfg.history[d.ym]; if (H) H.adj = {}; changed(); },
  };
  const CHG = {
    copyHeader: (d, v, el) => { state.copyHeader = el.checked; },
    text: (d, v) => { const ym = state.cur.month, T = texts(); T[ym] = T[ym] || {}; T[ym][d.k] = v; state.dirty = true; render(); },
    branchField: (d, v) => { branchByCode(d.b)[d.k] = C.clean(v); changed(); },
    cfgField: (d, v) => { state.cfg[d.k] = C.clean(v); changed(); },
    renameCenter: (d, v, el) => {
      if (!renameCenter(d.b, d.n, v)) { el.value = d.n; return; }
      // 대장에는 아직 예전 부서명으로 나오는 경우: 그 부서를 새 이름의 줄로 잇는다
      const to = C.clean(v);
      if (state.cur && state.cur.people.some(p => p.active && p.siteCode === d.b && p.dept === d.n) && !state.cfg.deptMap.some(x => x.dept === d.n && x.branch === d.b)) state.cfg.deptMap.push({ branch: d.b, dept: d.n, center: to });
      changed();
    },
    centerCost: (d, v) => { const b = branchByCode(d.b); b.centerOpts[d.n] = b.centerOpts[d.n] || {}; b.centerOpts[d.n][d.k] = C.clean(v); if (!b.centerOpts[d.n][d.k]) delete b.centerOpts[d.n][d.k]; changed(); },
    newIs: (d, v) => { // 새 부서 처리: rename:기존줄 / merge:기존줄
      if (!v) return; const [kind, target] = [v.slice(0, v.indexOf(':')), v.slice(v.indexOf(':') + 1)];
      if (kind === 'rename') renameCenter(d.b, target, d.n);
      else if (kind === 'merge') { state.cfg.deptMap = state.cfg.deptMap.filter(x => !(x.dept === d.n && x.branch === d.b)); state.cfg.deptMap.push({ branch: d.b, dept: d.n, center: target }); }
      changed();
    },
    personCenter: (d, v) => {
      const p = personOf(d.id); if (!p) return;
      state.cfg.people = state.cfg.people.filter(x => x.id !== p.id);
      if (v === '__split') { ACT.addSplit({ id: p.id }); return; }
      if (v && v !== '__dept') state.cfg.people.push({ id: p.id, name: p.name, branch: p.siteCode, center: v });
      changed();
    },
    splitMode: (d, v) => { const s = state.cfg.splits.find(x => x.id === d.id); s.mode = v; if (v === 'headcount') { s.adj = s.adj || {}; s.exclude = s.exclude || []; } else if (!s.parts || !s.parts.length) { const p = personOf(s.id); s.parts = [{ center: p ? p.dept : '', pct: 100 }]; } changed(); },
    partCenter: (d, v) => { state.cfg.splits.find(x => x.id === d.id).parts[Number(d.i)].center = v; changed(); },
    partPct: (d, v) => { state.cfg.splits.find(x => x.id === d.id).parts[Number(d.i)].pct = Math.round(C.NUM(v) * 100) / 100; changed(); },
    adj: (d, v) => { const s = state.cfg.splits.find(x => x.id === d.id); s.adj = s.adj || {}; const n = Math.round(C.NUM(v)); if (n) s.adj[d.n] = n; else delete s.adj[d.n]; changed(); },
    exclude: (d, v, el) => { const s = state.cfg.splits.find(x => x.id === d.id); s.exclude = (s.exclude || []).filter(x => x !== d.n); if (!el.checked) s.exclude.push(d.n); changed(); },
    manual: (d, v, el) => { const m = state.cfg.manual[Number(d.i)]; if (d.k === 'amount') m.amount = C.NUM(v); else if (d.k === 'repeat') { m.repeat = el.checked; if (!m.repeat && state.cur) m.month = state.cur.month; } else m[d.k] = d.k === 'memo' ? v : C.clean(v); changed(); },

  // ───────── 화면: 홈 ─────────
  function todoItems() {
    const s = state, out = [];
    s.fileErrors.forEach(t => out.push({ t, lv: 'w' }));
    if (!s.cur) return out;
    [...s.cur.warnings, ...(s.prev ? s.prev.warnings.map(t => '전월 대장: ' + t) : [])].forEach(t => out.push({ t, lv: 'w' }));
    if (s.v) s.v.warnings.forEach(t => out.push({ t, lv: 'w' }));
    if (s.memo) s.memo.warnings.forEach(t => out.push({ t, lv: 'w' }));
    if (s.alloc) {
      s.alloc.branches.forEach(b => { if (b.newCenters.length) out.push({ t: `${b.name}에 전표 줄 목록에 없던 부서가 있습니다: ${b.newCenters.join(', ')}. 일단 맨 아래 줄로 넣었습니다.`, lv: 'w', go: 'org', label: '조직·배분에서 정리' }); });
      s.alloc.notices.forEach(n => out.push({ t: n.text, lv: 'i', go: 'org', label: '규칙 정리' }));
    }
    if (s.prev && s.prev.month !== C.prevYm(s.cur.month)) out.push({ t: `전월 대장이 ${C.ymLabel(s.prev.month)}분입니다. 바로 앞 달(${C.ymLabel(C.prevYm(s.cur.month))})이 아닙니다.`, lv: 'w' });
    if (!s.prev && s.cur.kind === '급여') out.push({ t: '전월 급여대장을 함께 올리면 기안서의 전월 대비 표와 증감사유가 채워집니다.', lv: 'i' });
    if (s.cur.kind !== '급여') out.push({ t: `구분이 '${s.cur.kind}'인 대장입니다. 전표의 계정과목을 '${(s.cfg.defaults.bonusAccount || '상여금')}'으로, 적요를 '${s.cur.kind}'로 만들었습니다(상여 전표는 예시로 검증하지 않은 초안).`, lv: 'w' });
    if (s.histNote) out.push({ t: `${C.ymLabel(s.cur.month)} ${s.cur.kind === '급여' ? '값' : s.cur.kind + ' 값(월별 표에 급여와 합산)'}이 월별 이력에 들어갔습니다. 기안까지 마치면 오른쪽 위 [설정 넣어 앱 파일 저장]으로 저장하고, 그 파일을 담당자끼리 공유해 쓰세요.`, lv: 'i' });
    return out;
  }
  function viewHome() {

      <p class="lead">입사·퇴사·부서 이동은 대장에 적힌 부서를 그대로 따라갑니다.</p>`;
    html += `<div class="drop" id="drop" data-act="pick" tabindex="0" role="button"><b>급여대장 파일을 여기에 놓거나 눌러서 고르세요</b>

        + s.v.branches.map(b => { const k = b.checks; return `<tr><td><b>${h(b.name)}</b></td><td class="num">${k.heads}명</td>

          <td class="num">${won(k.net)} <span class="eq">${k.netOk ? '=' : '≠'}</span> ${won(k.accrued + k.manualNet)}</td><td class="num">${won(b.sangjoDeduct)}</td></tr>`; }).join('')
        + `<tr><td><b>합계</b></td><td class="num">${C.sum(s.v.branches, b => b.checks.heads)}명</td><td class="num"><b>${won(C.sum(s.v.branches, b => b.checks.gross))}</b></td><td class="num"><b>${won(C.sum(s.v.branches, b => b.checks.net))}</b></td><td class="num">${won(C.sum(s.v.branches, b => b.sangjoDeduct))}</td></tr></table></div>`;
    }

    }

      ${s.memo ? `<button class="step" data-act="go" data-v="memo"><i>2</i><span><b>급여기안</b><span>기안서 자료 엑셀 내려받기${s.prev ? '' : ' (전월 대장을 올리면 증감사유까지)'}</span></span></button>` : ''}</div>`;

  // ───────── 화면: 급여전표 ─────────
  const needLedger = name => `<h1>${name}</h1><div class="panel"><p class="hint" style="margin:0 0 12px">먼저 급여대장을 올려 주세요.</p><button class="btn pri" data-act="go" data-v="home">대장 등록으로 가기</button></div>`;
  function linesTable(lines) {
    return `<div class="tbl-wrap"><table class="grid"><tr>${VHEAD.map((x, i) => `<th class="${i === 3 || i === 4 ? 'num' : ''}">${x}</th>`).join('')}</tr>`
      + lines.map(l => `<tr class="${l.isNew || l.flag ? 'new' : ''}"><td class="mono">${l.no}</td><td>${h(l.account)}</td><td>${h(l.cost || '')}</td><td class="num">${won(l.debit)}</td><td class="num">${won(l.credit)}</td>
        <td>${h(l.memo)} ${l.isNew ? '<span class="chip warn">목록에 없던 부서</span>' : ''}${l.flag ? `<span class="chip warn">${h(l.flag)}</span>` : ''}${l.manual ? '<span class="chip acc">수기 행</span>' : ''}${l.extra ? `<span class="chip acc" title="${h(l.extraMemo)}">수기 ${won(l.extra)} 포함</span>` : ''}</td><td>${h(l.owner || '')}</td><td>${h(l.center || '')}</td></tr>`).join('')
      + `<tr class="sum"><td colspan="3">합계</td><td class="num">${won(C.sum(lines, l => l.debit || 0))}</td><td class="num">${won(C.sum(lines, l => l.credit || 0))}</td><td colspan="3"></td></tr></table></div>`;
  }
  function viewVoucher() {
    const s = state; if (!s.v) return needLedger('급여전표');
    const nb = s.v.branches.length; if (s.vtab > nb) s.vtab = 0;
    const isSj = s.vtab === nb && s.v.sangjo.length;
    let html = `<h1>${C.ymLabel(s.cur.month)} ${h(s.v.kind)}전표</h1><p class="lead">표를 복사해 ERP 전표 입력 화면에 그대로 붙여넣으세요. 금액이 0원인 줄은 빼고 행번호를 다시 매겼습니다.</p>`;
    html += `<div class="panel flat"><div class="panel-head"><div class="tabs">${s.v.branches.map((b, i) => `<button class="tab ${s.vtab === i ? 'on' : ''}" data-act="vtab" data-i="${i}">${h(b.name)}</button>`).join('')}${s.v.sangjo.length ? `<button class="tab ${isSj ? 'on' : ''}" data-act="vtab" data-i="${nb}">상조회비</button>` : ''}</div><span class="sp"></span>
      <label class="hint s"><input type="checkbox" data-chg="copyHeader" ${s.copyHeader ? 'checked' : ''}> 머리글도 복사</label>
      <button class="btn pri" data-act="copy" ${isSj ? 'data-k="sangjo"' : `data-i="${s.vtab}"`}>ERP 붙여넣기용 복사</button><button class="btn" data-act="dlVoucher">전표 엑셀 내려받기</button></div>`;
    if (isSj) {
      html += linesTable(s.v.sangjo) + `<div class="foot"><span class="hint">세 사업장을 이어서 행번호를 매겼습니다(예시 엑셀과 같은 방식). 회사 찬조분 = 직원 공제액 + 수기 추가분.</span></div>`;
    } else {
      const b = s.v.branches[s.vtab], k = b.checks, ab = s.alloc.branches[s.vtab];
      html += linesTable(b.lines) + `<div class="foot"><span class="chip ${k.grossOk ? 'ok' : 'err'}">차변 ${won(k.debit)} ${k.grossOk ? '=' : '≠'} 대장 지급계</span><span class="chip ${k.netOk ? 'ok' : 'err'}">미지급비용 ${won(k.accrued)} ${k.netOk ? '=' : '≠'} 대장 실지급계${k.manualNet ? ' − 수기 행' : ''}</span><span class="hint">지급 ${k.heads}명</span></div>`;
      html += `<details class="more"><summary>부서별로 어떻게 모였는지 보기</summary><div class="tbl-wrap"><table class="grid"><tr><th>활동센터</th><th class="num">직원 수</th><th class="num">직원 급여</th><th class="num">임원·겸직 배분</th><th>배분 받은 사람</th><th class="num">합계</th></tr>`
        + ab.centers.map(c => { const sh = C.sum(c.shares, x => x.pay); return `<tr><td>${h(c.name)}</td><td class="num">${c.count}</td><td class="num">${won(c.pay - sh)}</td><td class="num">${sh ? won(sh) : ''}</td><td class="hint s">${h(c.shares.map(x => C.displayName(x.from)).join(', '))}</td><td class="num">${won(c.pay)}</td></tr>`; }).join('')
        + `</table></div></details>`;
    }
    html += `</div>`;
    return html;
  }

  // ───────── 화면: 급여기안 ─────────
  function viewMemo() {
    const s = state; if (!s.memo) return s.cur ? `<h1>급여기안</h1><div class="panel"><p class="hint" style="margin:0 0 12px">${h(s.cur.kind)} 대장으로는 전표만 만듭니다. 급여기안은 급여 대장을 올렸을 때 나옵니다.</p><button class="btn pri" data-act="go" data-v="home">대장 등록으로 가기</button></div>` : needLedger('급여기안');
    const m = s.memo, ym = s.cur.month, nb = s.cfg.branches.length;
    let html = `<h1>${C.ymLabel(ym)}분 급여기안 자료</h1><p class="lead">기안에 첨부하는 엑셀을 예시와 같은 시트 구성으로 만듭니다. 증감사유의 비고는 초안이니 사유를 고쳐 쓴 뒤 내려받으세요.</p>`;
    html += `<div class="panel flat"><div class="panel-head"><div class="tabs">${[['doc', '기안서'], ['site', '사업장별'], ['month', '월별']].map(([k, t]) => `<button class="tab ${s.mtab === k ? 'on' : ''}" data-act="mtab" data-k="${k}">${t}</button>`).join('')}</div><span class="sp"></span>
      <span class="hint s">시트: 기안서 · 사업장별 · 월별 · 개인별 급여대장${s.prev ? ' · 개인별 전월대비 증감내역' : ''} · 참고(지난 2년)</span><button class="btn pri" data-act="dlMemo">기안 엑셀 내려받기</button></div><div style="padding:18px 20px">`;
    if (s.mtab === 'doc') {
      const tx = Object.assign({}, m.reasons ? m.reasons.draft : {}, texts()[ym] || {});
      const neg = n => (n < 0 ? `<span class="neg">(${won(-n)})</span>` : won(n));
      const dash = v => (v == null ? '-' : v);
      html += `<div class="doc"><h3>1. 세전금액</h3><div class="hint" style="margin-bottom:4px"><b>${h(C.summaryLine(m.preTotal))}</b></div>
        <table><tr><th rowspan="2">구분</th><th colspan="2">전월 (${C.ymShort(m.prevMonth)})</th><th colspan="2">당월 (${C.ymShort(ym)})</th><th colspan="3">증감</th></tr><tr><th>인원</th><th>금액</th><th>인원</th><th>금액</th><th>인원</th><th>금액</th><th>증감율</th></tr>`
        + [...m.pre.map(x => [x.name, x, '']), ['합계', m.preTotal, 'b']].map(([n, x, cls]) => { const hp = x.prevHeads != null; return `<tr class="${cls}"><td class="c">${h(n)}</td><td class="c">${dash(x.prevHeads)}</td><td class="num">${hp ? won(x.prevAmt) : '-'}</td><td class="c">${x.curHeads}</td><td class="num">${won(x.curAmt)}</td><td class="c">${hp ? x.curHeads - x.prevHeads : '-'}</td><td class="num">${hp ? neg(x.curAmt - x.prevAmt) : '-'}</td><td class="c">${hp && x.prevAmt ? ((x.curAmt - x.prevAmt) / x.prevAmt * 100).toFixed(1) + '%' : '-'}</td></tr>`; }).join('') + `</table>`;
      const postNote = (texts()[ym] && texts()[ym].post != null) ? texts()[ym].post : m.post.map(p => p.extraMemo).filter(Boolean).join('\n');
      const prow = (label, f, note) => `<tr><td class="c">${label}</td>${m.post.map(p => `<td class="num">${won(f(p))}</td>`).join('')}<td class="num"><b>${won(C.sum(m.post, f))}</b></td><td>${note || ''}</td></tr>`;
      html += `<h3>2. 세후금액</h3><table><tr><th>구분</th>${m.post.map(p => `<th>${h(p.short)}</th>`).join('')}<th>총합</th><th style="width:34%">비고</th></tr>`
        + prow('급여 실지급액(세후)', p => p.net) + prow('상조회(직원급여공제분)', p => p.sangjo) + prow('상조회(회사찬조금)', p => p.company, `<textarea rows="2" data-chg="text" data-k="post">${h(postNote)}</textarea>`) + prow('합계', p => p.net + p.sangjo + p.company) + `</table>`;
      html += `<h3>3. 전월대비 급여 증감사유</h3>`;
      if (!m.reasons) html += `<div class="card warn">전월 급여대장을 함께 올리면 증감사유 표가 채워집니다. <button class="btn sm" data-act="go" data-v="home">대장 등록으로 가기</button></div>`;
      else {
        const r = m.reasons, rows = n => Math.max(2, String(n || '').split('\n').length);
        const ta = k => `<textarea rows="${rows(tx[k])}" data-chg="text" data-k="${k}">${h(tx[k] || '')}</textarea>`;
        html += `<table><tr><th style="width:9%">증감구분</th><th style="width:27%">사유</th><th style="width:13%">금액</th><th>비고 (고쳐 쓸 수 있습니다)</th></tr>
          <tr class="b"><td class="c" colspan="2">합계</td><td class="num">${neg(r.total)}</td><td>${r.ok ? '<span class="chip ok">전월 대비 증감액과 일치</span>' : '<span class="chip err">증감액과 다릅니다</span>'}</td></tr>
          <tr class="sub"><td class="inc" rowspan="3">증가</td><td>소계</td><td class="num">${neg(r.inc)}</td><td></td></tr>
          <tr><td>최근 2개월 신규입사에 따른 인건비 증가</td><td class="num">${neg(r.amounts.hire)}</td><td>${ta('hire')}</td></tr>
          <tr><td>기타</td><td class="num">${neg(r.amounts.incEtc)}</td><td>${ta('incEtc')}</td></tr>
          <tr class="sub"><td class="dec" rowspan="3">감소</td><td>소계</td><td class="num">${neg(r.dec)}</td><td></td></tr>
          <tr><td>최근 2개월 퇴사자에 따른 인건비 감소</td><td class="num">${neg(r.amounts.leave)}</td><td>${ta('leave')}</td></tr>
          <tr><td>기타</td><td class="num">${neg(r.amounts.decEtc)}</td><td>${ta('decEtc')}</td></tr></table>
          <button class="btn sm" data-act="resetTexts">비고를 자동 초안으로 되돌리기</button> <span class="hint s">고친 비고는 [설정 넣어 앱 파일 저장]을 하면 앱 파일에 함께 저장됩니다.</span>`;
      }
      html += `</div>`;
    } else if (s.mtab === 'site') {
      const row = (k, cls) => `<tr class="${cls || ''}"><td>${h(C.keyLabel(k, true))}</td>${m.site.cols.map(c => `<td class="num">${won(c[k] || 0)}</td>`).join('')}<td class="num">${won(C.sum(m.site.cols, c => c[k] || 0))}</td></tr>`;
      const sub = (label, f) => `<tr class="sum"><td>${label}</td>${m.site.cols.map(c => `<td class="num">${won(f(c))}</td>`).join('')}<td class="num">${won(C.sum(m.site.cols, f))}</td></tr>`;
      html += `<div class="tbl-wrap" style="max-width:820px"><table class="grid"><tr><th>구분</th>${m.post.map(p => `<th class="num">${h(p.short)}</th>`).join('')}<th class="num">총합</th></tr>
        <tr><td>지급인원</td>${m.site.heads.map(x => `<td class="num">${x}</td>`).join('')}<td class="num">${C.sum(m.site.heads)}</td></tr>`
        + m.site.payKeys.map(k => row(k)).join('') + sub('지급 소계', c => C.sum(m.site.payKeys, k => c[k] || 0)) + m.site.dedKeys.map(k => row(k)).join('') + sub('공제 소계', c => C.sum(m.site.dedKeys, k => c[k] || 0)) + sub('실지급액', c => C.paySum(c) - C.dedSum(c)) + `</table></div>`;
    } else {
      html += `<p class="hint" style="margin-top:0">월별 표는 [월별 이력]에 쌓인 값으로 만듭니다. 상여가 있는 달은 상여 대장을 (전표를 만들 때) 올려 두면 그 달 열에 합산됩니다. <button class="btn sm" data-act="go" data-v="history">월별 이력 열기</button></p>` + histTable(ym.slice(0, 4), ym, false);
    }
    html += `</div></div>`;
    return html;
  }

  // ───────── 화면: 조직·배분 ─────────
  const opts = (list, sel, extra) => (extra || '') + list.map(n => `<option value="${h(n)}" ${n === sel ? 'selected' : ''}>${h(n)}</option>`).join('');
  function viewOrg() {
    const s = state, cfg = s.cfg;
    let html = `<h1>조직·배분 설정</h1><p class="lead">대장의 부서명이 곧 전표 줄(활동센터)입니다. 여기에는 그 규칙에서 벗어나는 것만 적습니다. 입사·퇴사·부서 이동은 대장을 올리면 따라오고, 새 부서나 이름이 바뀐 부서는 아래에서 한 번만 정리하면 됩니다.</p>`;
    const tabs = [['people', '변동사항 · 인원 배치'], ['lines', '사업장별 활동센터'], ['splits', '임원 · 겸직 배분'], ['manual', '수기 행 · 예수금 줄']];
    html += `<div class="tabs" style="margin-bottom:12px">${tabs.map(([k, t]) => `<button class="tab ${s.otab === k ? 'on' : ''}" data-act="otab" data-k="${k}">${t}</button>`).join('')}</div>`;
    if (s.otab === 'people') html += orgPeople();
    else if (s.otab === 'lines') html += orgLines();
    else if (s.otab === 'splits') html += orgSplits();
    else html += orgManual();
    return html;
  }
  function orgPeople() {
    const s = state, cfg = s.cfg; let html = '';
    if (!s.alloc) return `<div class="panel"><p class="hint" style="margin:0 0 12px">급여대장을 올리면 이번 달에 달라진 부서를 찾아 주고, 사람을 검색해 다른 줄로 옮길 수 있습니다.</p><button class="btn pri" data-act="go" data-v="home">대장 등록으로 가기</button></div>` + rulesOnly();
    // 달라진 것
    const cards = [];
    s.alloc.unknownSites.forEach(u => cards.push(`<div class="card warn"><div class="row"><b class="nm">새 사업장 ${h(u.code)} ${h(u.name || '')}</b><span class="chip warn">${u.count}명 · 전표에서 빠져 있음</span><span style="flex:1"></span><button class="btn pri sm" data-act="addBranch" data-code="${h(u.code)}">사업장으로 추가</button></div></div>`));
    s.alloc.branches.forEach(b => b.newCenters.forEach(n => {
      const c = b.centers.find(x => x.name === n), known = b.cfg.centers, idle = known.filter(k => { const kc = b.centers.find(x => x.name === k); return !kc || kc.count === 0; });
      const who = c.members.slice(0, 6).map(p => C.displayName(p.name)).join(', ') + (c.members.length > 6 ? ' 외' : '');
      cards.push(`<div class="card warn"><div class="row"><b class="nm">${h(n)}</b><span class="chip">${h(b.name)}</span><span class="chip warn">전표 줄 목록에 없던 부서</span><span class="hint s">직원 ${c.count}명${who ? ' (' + h(who) + ')' : ''}${c.shares.length ? ' · 임원 배분 받음' : ''}</span></div>
        <div class="row"><button class="btn pri sm" data-act="acceptCenter" data-b="${b.code}" data-n="${h(n)}">새 줄로 추가</button>
        ${idle.length ? `<select data-chg="newIs" data-b="${b.code}" data-n="${h(n)}"><option value="">이름만 바뀐 부서라면 예전 이름 고르기 (이번 달 직원 0명인 줄)</option>${idle.map(x => `<option value="rename:${h(x)}">${h(x)} → ${h(n)}</option>`).join('')}</select>` : ''}
        ${known.length ? `<select data-chg="newIs" data-b="${b.code}" data-n="${h(n)}"><option value="">기존 줄에 합치기</option>${known.map(x => `<option value="merge:${h(x)}">${h(x)} 줄에 합치기</option>`).join('')}</select>` : ''}
        ${c.count === 1 ? `<button class="btn sm" data-act="addSplit" data-id="${h(c.members[0].id)}">본부장·겸직이면 여러 부서로 나누기</button>` : ''}</div></div>`);
    }));
    s.alloc.notices.forEach(n => cards.push(`<div class="card"><div class="row"><span>${h(n.text)}</span><span style="flex:1"></span>${n.type === 'split-missing' ? `<button class="btn sm danger" data-act="delSplit" data-id="${h(n.id)}">배분 규칙 지우기</button>` : n.type === 'person-missing' ? `<button class="btn sm danger" data-act="delPerson" data-id="${h(n.id)}">지정 지우기</button>` : `<button class="btn sm danger" data-act="delDeptMap" data-i="${cfg.deptMap.findIndex(d => d.dept === n.dept)}">연결 지우기</button>`}</div></div>`));
    html += `<div class="panel"><h2>이번 대장의 변동사항</h2>${cards.length ? `<div class="cards">${cards.join('')}</div>` : `<p class="hint" style="margin:0">새 부서나 정리할 규칙이 없습니다. 모든 사람이 전표 줄에 들어갔습니다.</p>`}</div>`;
    // 사람 목록
    const VIA = { dept: '대장 부서 그대로', deptMap: '부서 연결', person: '사람별 지정', split: '임원·겸직 배분' };
    const rows = [];
    s.alloc.branches.forEach(b => b.people.forEach(p => {
      const r = p._res; if (s.onlyRules && r.via === 'dept') return;
      const names = centerNames(b.code);
      const sel = r.via === 'split' ? `<span class="chip acc">여러 부서로 나눔</span> <button class="btn sm ghost" data-act="otab" data-k="splits">배분 보기</button>`
        : `<select data-chg="personCenter" data-id="${h(p.id)}"><option value="__dept" ${r.via !== 'person' ? 'selected' : ''}>${(() => { const dm = state.cfg.deptMap.find(x => x.dept === p.dept && (!x.branch || x.branch === p.siteCode)); return dm ? '부서 연결대로 (' + h(dm.center) + ')' : '대장 부서 그대로 (' + h(p.dept) + ')'; })()}</option>${names.filter(n => n !== p.dept || r.via === 'person').map(n => `<option value="${h(n)}" ${r.via === 'person' && r.center === n ? 'selected' : ''}>${h(n)}</option>`).join('')}<option value="__split">여러 부서로 나누기…</option></select>`;
      rows.push(`<tr data-q="${h((p.name + ' ' + p.dept + ' ' + b.name + ' ' + p.title).toLowerCase())}"><td><b>${h(p.name)}</b></td><td>${h(b.short)}</td><td>${h(p.dept)}</td><td>${h(p.title)}</td><td>${sel}</td><td><span class="chip ${r.via === 'dept' ? '' : 'acc'}">${VIA[r.via]}</span></td></tr>`);
    }));
    html += `<div class="panel flat"><div class="panel-head"><h2>사람 찾아서 옮기기</h2><span class="sp"></span><label class="hint s"><input type="checkbox" data-chg="onlyRules" ${s.onlyRules ? 'checked' : ''}> 예외만 보기</label><input type="text" id="pq" placeholder="이름·부서로 찾기" style="width:200px"></div>
      <div class="tbl-wrap" style="max-height:520px"><table class="grid" id="ptbl"><tr><th>성명</th><th>사업장</th><th>대장 부서</th><th>직책</th><th>전표 줄(활동센터)</th><th>정해진 방식</th></tr>${rows.join('') || '<tr><td colspan="6" class="hint">해당하는 사람이 없습니다.</td></tr>'}</table></div>
      <div class="foot"><span class="hint">ERP에서 부서를 옮기면 다음 대장부터 저절로 따라갑니다. 대장의 부서와 전표 줄이 달라야 하는 사람만 여기서 바꾸세요.</span></div></div>`;
    return html;
  }
  function rulesOnly() {
    const cfg = state.cfg;
    return `<div class="panel flat"><div class="panel-head"><h2>지금 저장된 예외</h2></div><div class="tbl-wrap"><table class="grid"><tr><th>대상</th><th>규칙</th></tr>`
      + cfg.people.map(p => `<tr><td>${h(p.name)}</td><td>${h(p.center)} 줄로 보냄</td></tr>`).join('')
      + cfg.deptMap.map(d => `<tr><td>부서 ${h(d.dept)}</td><td>${h(d.center)} 줄에 합침</td></tr>`).join('')
      + cfg.splits.map(x => `<tr><td>${h(x.name)}</td><td>${x.mode === 'headcount' ? '사업장 전체에 인원수 비례' : h((x.parts || []).map(p => `${p.center} ${p.pct}%`).join(' · '))}</td></tr>`).join('') + `</table></div></div>`;
  }
  function orgLines() {
    const s = state, cfg = s.cfg; if (s.obranch >= cfg.branches.length) s.obranch = 0;
    const b = cfg.branches[s.obranch], ab = allocBranch(b.code);
    let html = `<div class="panel flat"><div class="panel-head"><div class="tabs">${cfg.branches.map((x, i) => `<button class="tab ${s.obranch === i ? 'on' : ''}" data-act="obranch" data-i="${i}">${h(x.name)}</button>`).join('')}</div><span class="sp"></span><span class="hint s">대장의 사업장코드 ${h(b.code)}</span></div>
      <div class="fields">${[['name', '사업장 이름 (적요에 들어감)'], ['short', '짧은 이름 (기안 표·시트 이름)'], ['taxOffice', '세무서'], ['cityOffice', '시·구청']].map(([k, t]) => `<label class="field">${t}<input type="text" value="${h(b[k] || '')}" data-chg="branchField" data-b="${b.code}" data-k="${k}"></label>`).join('')}</div>`;
    const rows = b.centers.map((n, i) => {
      const c = ab && ab.centers.find(x => x.name === n), o = b.centerOpts[n] || {};
      return `<tr><td><div class="order"><button data-act="moveCenter" data-b="${b.code}" data-n="${h(n)}" data-dir="-1" title="위로" ${i === 0 ? 'disabled' : ''}>↑</button><button data-act="moveCenter" data-b="${b.code}" data-n="${h(n)}" data-dir="1" title="아래로" ${i === b.centers.length - 1 ? 'disabled' : ''}>↓</button></div></td>
        <td class="mono">${C.pad3(i + 1)}</td><td><input type="text" value="${h(n)}" data-chg="renameCenter" data-b="${b.code}" data-n="${h(n)}" style="width:220px"></td>
        <td class="num">${c ? c.count + '명' : ''}</td><td class="num">${c ? won(c.pay) : (ab ? '<span class="chip">이번 달 금액 없음</span>' : '')}</td>
        <td><input type="text" value="${h(o.account || '')}" placeholder="${h(cfg.defaults.account || '직원급여')}" data-chg="centerCost" data-b="${b.code}" data-n="${h(n)}" data-k="account" style="width:130px"></td>
        <td><input type="text" value="${h(o.cost || '')}" placeholder="${h(cfg.defaults.cost || '판관')}" data-chg="centerCost" data-b="${b.code}" data-n="${h(n)}" data-k="cost" style="width:70px"></td>

    }).join('');

    html += `<div class="tbl-wrap"><table class="grid"><tr><th></th><th>줄 순서</th><th>활동센터 (이름을 고치면 관련 규칙도 함께 바뀝니다)</th><th class="num">직원 수</th><th class="num">이번 달 급여</th><th>계정과목</th><th>비용구분</th><th></th></tr>${rows}
      ${fresh.map(n => `<tr class="new"><td></td><td class="mono">새 부서</td><td><b>${h(n)}</b></td><td class="num">${ab.centers.find(x => x.name === n).count}명</td><td class="num">${won(ab.centers.find(x => x.name === n).pay)}</td><td colspan="2" class="hint s">지금은 맨 아래 줄로 들어갑니다</td><td><button class="btn sm pri" data-act="acceptCenter" data-b="${b.code}" data-n="${h(n)}">목록에 추가</button></td></tr>`).join('')}</table></div>
      <div class="foot"><input type="text" id="newCenter" placeholder="새 활동센터 이름" style="width:220px"><button class="btn" data-act="addCenter" data-b="${b.code}">줄 추가</button><span class="hint">금액이 0원인 줄은 전표에서 자동으로 빠지므로, 안 쓰는 줄을 남겨 두어도 괜찮습니다.</span></div></div>`;
    // 부서 연결
    html += `<div class="panel flat"><div class="panel-head"><h2>부서 연결</h2><span class="hint s">대장의 부서 이름과 다른 전표 줄에 합치는 부서</span></div><div class="tbl-wrap"><table class="grid"><tr><th>사업장</th><th>대장 부서</th><th>합칠 전표 줄</th><th></th></tr>`
