<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{--brand:#004123;--brand-50:#E9F1EC;--brand-line:#B9CFC2;--ivory:#FDF7EC;--ink:#1F2328;--sub:#5B6470;--mute:#98A1AC;--line:#E8E1D4;--card:#FFFFFF;
--done:#1E8E3E;--done-50:#E6F6EA;--wait:#9A5B00;--wait-50:#FFF1D9;--no:#B42318;--no-50:#FDECEA;--cancel:#5B6470;--cancel-50:#EEF0F2;--change:#2457A6;--change-50:#E8F0FB;--retro:#6B3FA0;--retro-50:#F3EAFB}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.5 "Segoe UI","맑은 고딕","Malgun Gothic",sans-serif;color:var(--ink);background:var(--ivory)}
button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}

.logo{display:block;font-weight:700;color:var(--brand);font-size:16px;margin:0 8px 18px;text-decoration:none;cursor:pointer}nav a.logo,nav a.logo:hover{display:block;padding:0;background:none;color:var(--brand);font-weight:700}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--sub);margin-bottom:2px;text-decoration:none;cursor:pointer}

.kpi .card{padding:14px 16px;margin:0;cursor:default}.kpi .card.go{cursor:pointer}.kpi .card.go:hover{border-color:var(--brand-line)}

.g{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:14px}.g .card{margin:0}

tr:last-child td{border:0}tr.ck{cursor:pointer}tr.ck:hover td{background:#FBF8F2}
.empty{color:var(--mute);text-align:center;padding:22px 0;font-size:13px}
.empty .btn{margin-top:8px}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.st.w{background:var(--wait-50);color:var(--wait)}.st.o{background:var(--done-50);color:var(--done)}.st.n{background:var(--no-50);color:var(--no)}
.st.c{background:var(--cancel-50);color:var(--cancel)}.st.ch{background:var(--change-50);color:var(--change)}.st.r{background:var(--retro-50);color:var(--retro)}
.btn{display:inline-block;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--brand-line)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.no{color:var(--no);border-color:#F1B8B2}.btn.sm{padding:4px 10px;font-size:12px}.btn[disabled]{opacity:.4;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}

.types{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}

.bal .rem{background:var(--brand-50);border-color:var(--brand-line)}.bal .rem b{color:var(--brand)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}

.step.d{color:var(--done);border-color:#BFE3C8;background:var(--done-50)}.step.cur{background:var(--brand-50);border-color:var(--brand-line);color:var(--brand);font-weight:600}
.step.x{color:var(--no);border-color:#F1B8B2;background:var(--no-50)}
.hb div{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.hb span{color:var(--sub)}.hb .tr{height:14px;background:#F3EDE2;border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--brand)}.hb b{text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px}
.cal .h{color:var(--sub);text-align:center}
.cal .c{border-radius:6px;padding:4px 5px;background:#F7F2E8;min-height:58px}
.cal .c.o{background:transparent}.cal .c.td{outline:2px solid var(--ink)}
.cal .c i{display:block;font-style:normal;font-size:10px;border-radius:4px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .c i.o{background:var(--brand);color:#fff}.cal .c i.w{background:var(--wait-50);color:var(--wait)}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;font-size:13px}
.info small{display:block;color:var(--sub);font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;display:flex;gap:12px;align-items:center;z-index:9;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%)}.toast .btn{padding:4px 10px;font-size:12px}
.view{animation:fi .18s ease}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.soon{text-align:center;padding:60px 0;color:var(--sub)}
.doc{width:100%;height:calc(100vh - 170px);border:1px solid var(--line);border-radius:10px;background:#fff}
.muted{color:var(--mute)}
.rules details{border-bottom:1px solid var(--line);padding:6px 0}.rules summary{cursor:pointer;font-weight:600}.rules p{white-space:pre-wrap;font-size:13px;color:var(--sub);margin:6px 0 4px;line-height:1.7}mark{background:#FFE58F}
.org details{margin-left:14px}.org>details{margin-left:0}.org summary{cursor:pointer;padding:4px 0}.org .sub{border-left:1px dashed var(--line);margin-left:6px;padding-left:4px}.org .leaf{margin-left:14px;padding:3px 0 3px 14px}.org a{color:var(--brand);font-weight:600;text-decoration:none}.org a:hover{text-decoration:underline}
.card .fld{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;max-width:150px}.right{text-align:right}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 nav{position:sticky;top:0;height:auto;display:flex;align-items:center;gap:4px;overflow-x:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);z-index:5}
 nav .logo{margin:0 8px;white-space:nowrap}nav .sec{display:none}nav a{white-space:nowrap;margin:0}
 main{padding:12px}
 .kpi{grid-template-columns:repeat(2,1fr)}.g,.g2{grid-template-columns:1fr}
 .form{grid-template-columns:1fr}.info{grid-template-columns:repeat(2,1fr)}.bal{grid-template-columns:repeat(2,1fr)}
 table{font-size:12px}.hide-m{display:none}
}
</style></head><body>
<div class="app">
<nav id="nav"></nav>
<main>
<div class="bar">
 <span class="lb">보는 사람</span>
 <div class="seg" id="roles"><button data-r="emp">직원</button><button data-r="lead">팀장</button><button data-r="hr">인사</button></div>
 <select id="me" title="어느 직원으로 볼지"></select>
 <span class="sp"></span>
 <a class="btn sm" id="bell" href="#inbox" title="알림함">알림</a>
 <button class="btn sm" id="reset">처음부터 다시</button>
</div>
<div id="guide"></div>
<div id="view" class="view"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
const KEY='hurom-ehr-sim-v1';
const TYPES={'연차':{days:'range',deduct:true},'오전반차':{days:0.5,deduct:true},'오후반차':{days:0.5,deduct:true},'외근':{days:'range',deduct:false},'경조휴가':{days:'range',deduct:false},'병가':{days:'range',deduct:false},'공가':{days:'range',deduct:false},'대체휴무':{days:'range',deduct:false}};
const DEPTS=['경영지원팀','인사팀','상품기획팀','연구개발팀','디자인팀','영업팀','마케팅팀','품질팀','생산팀'];
const S={LEAD:'팀장 대기',HR:'인사 대기',OK:'확정',NO:'반려',CL:'취소요청',CH:'취소 인사 대기',CX:'취소됨',WD:'회수'};
let st=load();
function blank(){return {people:[],reqs:[],depts:DEPTS.slice(),role:'hr',me:'',seq:1,pseq:1,moves:[],pays:[],vouchers:[],exps:[],certs:[],evals:[],jobs:[],apps:[],xseq:1,erp:[],accts:[],welfare:[],edus:[],punches:[],ots:[],flex:[],closes:[],bonus:{},tasks:[],contracts:{},notices:[],ye:[],rates:{np:4.75,hi:3.595,ltc:13.14,ei:0.9,tax:3}}}
function load(){try{const d=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{});if(!d.depts||!d.depts.length)d.depts=DEPTS.slice();return d}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const now=()=>{const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const WD='일월화수목금토';
function workdays(a,b){let n=0;const d=new Date(a+'T00:00');const e=new Date(b+'T00:00');while(d<=e){const w=d.getDay();if(w&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
function person(no){return st.people.find(p=>p.no===no)}
function grant(p){ // 근로기준법 기준 연차 발생
 if(!p||!p.join)return 0;const j=new Date(p.join+'T00:00'),t=new Date();
 let m=(t.getFullYear()-j.getFullYear())*12+(t.getMonth()-j.getMonth());if(t.getDate()<j.getDate())m--;
 if(m<0)return 0;if(m<12)return Math.min(m,11);const y=Math.floor(m/12);return Math.min(25,15+Math.floor((y-1)/2))}
function bal(no){
 const p=person(no);let used=0,res=0,pend=0;
 st.reqs.filter(r=>r.no===no&&TYPES[r.type].deduct).forEach(r=>{
  if(r.status===S.OK||r.status===S.CL||r.status===S.CH)used+=r.days;
  else if(r.status===S.HR)res+=r.days;else if(r.status===S.LEAD)pend+=r.days});
 const g=grant(p);return {grant:g,used,res,pend,rem:g-used-res}}
function stepName(r){const p=person(r.no);return p&&p.pos==='팀장'?'본부장 승인':'팀장 승인'}
function badge(s){const m={[S.LEAD]:'w',[S.HR]:'ch',[S.OK]:'o',[S.NO]:'n',[S.CL]:'c',[S.CH]:'c',[S.CX]:'c',[S.WD]:'c'};
 const lab={[S.LEAD]:'승인 대기',[S.HR]:'인사 확정 대기',[S.OK]:'인사확정',[S.NO]:'반려',[S.CL]:'취소요청',[S.CH]:'취소요청 · 인사 대기',[S.CX]:'취소',[S.WD]:'회수'};
 return '<span class="st '+m[s]+'">'+lab[s]+'</span>'}
function steps(r){
 const sn=stepName(r);const a=[['신청','d']];
 if(r.status===S.LEAD)a.push([sn,'cur'],['인사 확정','']);
 else if(r.status===S.NO){const by=r.hist.slice(-1)[0];a.push([by&&by.act.includes('인사')?sn:sn+' 반려',by&&by.act.includes('인사')?'d':'x']);if(by&&by.act.includes('인사'))a.push(['인사 반려','x'])}
 else if(r.status===S.WD)a.push(['회수','x']);
 else{a.push([sn,'d']);if(r.status===S.HR)a.push(['인사 확정','cur']);else{a.push(['인사 확정','d']);
  if(r.status===S.CL)a.push(['취소 '+sn,'cur'],['취소 확정','']);if(r.status===S.CH)a.push(['취소 '+sn,'d'],['취소 확정','cur']);if(r.status===S.CX)a.push(['취소 확정','d'])}}
 return '<div class="line">'+a.map((x,i)=>(i?'›':'')+'<span class="step '+x[1]+'">'+x[0]+'</span>').join('')+'</div>'}
function period(r){return r.from===r.to?r.from.slice(5)+'('+WD[new Date(r.from+'T00:00').getDay()]+')':r.from.slice(5)+' ~ '+r.to.slice(5)}
function daysTxt(r){return TYPES[r.type].deduct?r.days+'일':'—'}
function act(r,who,what,memo){r.hist.push({at:now(),who,act:what,memo:memo||''})}
const roleName={emp:'직원',lead:'팀장',hr:'인사'};
function whoAmI(){if(st.role==='emp'){const p=person(st.me);return p?p.name:'직원'}return st.role==='lead'?'팀장(결재자)':'인사 담당'}
function leadQ(){return st.reqs.filter(r=>r.status===S.LEAD||r.status===S.CL)}
function hrQ(){return st.reqs.filter(r=>r.status===S.HR||r.status===S.CH)}
function absentOn(d){return st.reqs.filter(r=>r.from<=d&&d<=r.to&&(r.status===S.OK||r.status===S.HR||r.status===S.CL||r.status===S.CH))}

/* ---------- 토스트 ---------- */
let tt;function toast(msg,btn,go){const t=$('#toast');t.innerHTML=esc(msg)+(btn?' <button class="btn sm">'+esc(btn)+'</button>':'');
 if(btn)t.querySelector('button').onclick=()=>{t.classList.remove('show');go()};t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),btn?7000:3000)}
function switchRole(r,route){st.role=r;save();if(route&&location.hash!==route)location.hash=route;else render()}

/* ---------- 메뉴 ---------- */
const MENU=[['dash','인사 대시보드'],['inbox','알림함'],null,'인사',['people','인원 명부'],['org','조직도'],['card','인사카드'],['move','인사발령'],['onoff','입사·퇴사'],['bulk','일괄 처리'],['cert','증명서'],null,'근태',['leave','근태·휴가 신청'],['work','출퇴근·52시간'],['status','근태 현황'],['promote','연차 촉진'],null,'급여·복리·전표',['close','월 마감'],['pay','급여'],['welfare','복리후생'],['exp','경비 청구'],['voucher','전표'],['erp','ERP 연동'],['yearend','연말정산'],null,'성과·교육·채용',['eval','평가'],['edu','교육'],['hire','채용'],null,'관리',['data','데이터 관리'],null,'문서',['rules','휴롬 규정'],['plan','기획서'],['prd','PRD(요구사항)']];
function nav(cur){
 const Q={leave:st.role==='lead'?leadQ().length:st.role==='hr'?hrQ().length:0,exp:expQ().length,cert:st.role==='hr'?st.certs.filter(c=>c.status==='신청').length:0,eval:evalQ().length,welfare:st.role==='hr'?st.welfare.filter(x=>x.status==='신청'||x.status==='승인').length:0,work:st.role==='lead'?otQ().length+flexQ().length:0,onoff:st.role==='hr'?st.tasks.filter(t=>!t.done&&dayLeft(t.due)<=7).length:0,inbox:inboxItems().length,edu:st.role==='emp'?st.edus.filter(e=>e.no===st.me&&!e.done).length:0};
 $('#nav').innerHTML='<a class="logo" href="#dash" title="홈(인사 대시보드)">HUROM EHR</a>'+MENU.map(m=>{if(m===null)return '';if(typeof m==='string')return '<div class="sec">'+m+'</div>';
  const n=Q[m[0]]?'<span class="n">'+Q[m[0]]+'</span>':'';return '<a href="#'+m[0]+'" class="'+(cur===m[0]?'on':'')+'">'+m[1]+n+'</a>'}).join('')}

/* ---------- 흐름 안내 ---------- */
function guide(){
 const hasP=st.people.length>0,hasR=st.reqs.length>0,hasL=st.reqs.some(r=>r.status!==S.LEAD),hasOK=st.reqs.some(r=>r.status===S.OK||r.status===S.CX||r.status===S.CL||r.status===S.CH);

function reqTable(rs,showName,mode){

function actions(r,mode){

  if(r.status===S.CL)return '<button class="btn p sm" data-a="clok" data-id="'+id+'">취소 승인</button> <button class="btn no sm" data-a="clno" data-id="'+id+'">취소 반려</button>'}
 if(mode==='hr'){if(r.status===S.HR)return '<button class="btn p sm" data-a="hrok" data-id="'+id+'">인사 확정</button> <button class="btn no sm" data-a="hrno" data-id="'+id+'">반려</button>';
  if(r.status===S.CH)return '<button class="btn p sm" data-a="chok" data-id="'+id+'">취소 확정</button>'}
 if(mode==='mine'){if(r.status===S.LEAD)return '<button class="btn sm" data-a="wd" data-id="'+id+'">회수</button>';
  if((r.status===S.HR||r.status===S.OK))return '<button class="btn sm" data-a="cl" data-id="'+id+'">취소 요청</button>';
  if(r.status===S.NO||r.status===S.WD)return '<button class="btn sm" data-a="re" data-id="'+id+'">다시 신청</button>'}
 return ''}

function addVoucher(kind,date,desc,lines,ref){st.vouchers.push({id:nid(),no:'V'+date.replace(/-/g,'').slice(0,8)+'-'+String(st.vouchers.length+1).padStart(3,'0'),kind,date,desc,ref,lines:lines.filter(l=>l[1]||l[2]).map(l=>({acct:l[0],dr:l[1],cr:l[2]})),at:now()});const v=st.vouchers[st.vouchers.length-1];erpQ('전표',v.id,v.no+' '+desc)}
V.voucher=(k)=>{
 const kinds=['전체','급여','경비','복리후생'];k=kinds.includes(decodeURIComponent(k||''))?decodeURIComponent(k):'전체';

 const DR=vs.reduce((a,v)=>a+v.lines.reduce((x,l)=>x+l.dr,0),0),CR=vs.reduce((a,v)=>a+v.lines.reduce((x,l)=>x+l.cr,0),0);

 '<div class="tabs">'+kinds.map(x=>'<a href="#voucher/'+x+'" class="'+(x===k?'on':'')+'">'+x+'</a>').join('')+'</div>'+
 '<div class="kpi" style="grid-template-columns:repeat(3,1fr)"><div class="card"><small>전표</small><b>'+vs.length+'<em>건</em></b></div><div class="card"><small>차변 합계</small><b style="font-size:22px">'+won(DR)+'<em>원</em></b></div><div class="card"><small>대변 합계</small><b style="font-size:22px">'+won(CR)+'<em>원</em></b><div class="d">'+(DR===CR?'차대 일치':'<span style="color:var(--no)">차대 불일치</span>')+'</div></div></div>'+
 (vs.length?vs.map(v=>{const d=v.lines.reduce((a,l)=>a+l.dr,0),c=v.lines.reduce((a,l)=>a+l.cr,0);return sec(v.no+' · '+v.desc,stB(v.kind==='급여'?'확정':'지급 확정').replace(/>[^<]+</,'>'+v.kind+'<')+' 전표일 '+v.date+' · '+(d===c?'차대 일치':'불일치')+(v.erpNo?' · '+v.erpNo:' · ERP 보내기 전'),'<table><tr><th>계정</th><th class="right">차변</th><th class="right">대변</th></tr>'+v.lines.map(l=>'<tr><td>'+l.acct+'</td><td class="right">'+(l.dr?won(l.dr):'')+'</td><td class="right">'+(l.cr?won(l.cr):'')+'</td></tr>').join('')+'<tr><td><b>합계</b></td><td class="right"><b>'+won(d)+'</b></td><td class="right"><b>'+won(c)+'</b></td></tr></table>')}).join('')+'<button class="btn" id="v_csv">ERP 올리기용 CSV</button>':sec('전표','','<div class="empty">아직 전표가 없습니다<br>급여를 확정하거나 경비를 지급 확정하면 생깁니다<br><a class="btn sm" href="#pay">급여로</a> <a class="btn sm" href="#exp">경비 청구로</a></div>'))};

V.erp=()=>{
 st.erp=st.erp||[];const out=st.erp.filter(x=>x.dir==='보내기'),inn=st.erp.filter(x=>x.dir==='받기'),wait=out.filter(x=>x.status==='대기'),sent=out.filter(x=>x.status==='보냄');const hr=st.role==='hr';

 '<div class="guide"><span class="nx">시뮬레이션입니다. 실제 영림원 ERP 연결(주소·형식·인증)은 2차에서 주관사와 정한 뒤 이 자리에 붙입니다.</span></div>'+

 sec('보내기 (EHR → ERP)','전표를 만들거나 인원·발령이 바뀌면 자동으로 쌓입니다',

 sec('받기 (ERP → EHR)','ERP에서 내려받은 CSV를 올리면 반영합니다 · 첫 줄: 구분,코드,이름 (구분 = 부서 또는 계정)',

  '<div style="margin-top:10px">'+tbl(['받은 시각','종류','내용','상태'],inn.slice().reverse().map(x=>'<tr><td class="tag">'+x.at+'</td><td>'+stB(x.kind)+'</td><td>'+esc(x.desc)+'</td><td>'+stB(x.status)+'</td></tr>'),'받은 것이 없습니다')+'</div>'+

function wireErp(){
 const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};

 on('#erp_json',()=>dl('EHR_to_ERP_'+today()+'.json',JSON.stringify(st.erp.filter(x=>x.dir==='보내기').map(x=>({kind:x.kind,desc:x.desc,status:x.status,erpNo:x.erpNo||null,data:x.kind==='전표'?st.vouchers.find(v=>v.id===x.ref):x.kind==='인원'?person(x.ref):st.pays.find(p=>p.ym===x.ref)})),null,1),'application/json'));
 on('#erp_tpl',()=>dl('ERP_받기_양식.csv',csv([['구분','코드','이름'],['부서','D100','(부서 이름)'],['계정','80200','(계정 이름)']]),'text/csv'));
 const fi=$('#erp_in');if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;f.text().then(t=>{const rows=t.replace(/^﻿/,'').split(/\r?\n/).slice(1).map(l=>l.split(',').map(v=>v.replace(/^"|"$/g,'').trim())).filter(r=>r.length>=3&&r[2]);

let ORG=null,RULES=null;
fetch('hurom_org.json').then(r=>r.json()).then(d=>{ORG=d;render()}).catch(()=>{});
fetch('hurom_rules.json').then(r=>r.json()).then(d=>{RULES=d;render()}).catch(()=>{});
function findRule(t){if(!RULES)return null;for(const g in RULES.groups){const x=RULES.groups[g].find(r=>r.title.startsWith(t));if(x)return x}return null}
function ruleBox(titles){
 if(!RULES)return '';const xs=titles.map(findRule).filter(Boolean);if(!xs.length)return '';
 return sec('관련 규정','휴롬 생활백서 원문 · 누르면 펼침','<div class="rules">'+xs.map(x=>'<details><summary>'+esc(x.title)+'</summary><p>'+esc(x.text)+'</p></details>').join('')+'</div><div style="margin-top:8px"><a class="btn sm" href="#rules">규정 전체 보기</a></div>')}
V.rules=(g)=>{
 if(!RULES)return head('휴롬 규정')+sec('','','<div class="empty">불러오는 중…</div>');
 const gs=Object.keys(RULES.groups);g=gs.includes(decodeURIComponent(g||''))?decodeURIComponent(g):gs[0];
 return head('휴롬 규정',esc(RULES.source))+'<div class="bar" style="margin-bottom:10px"><input id="rq" class="fld" style="max-width:none;flex:1" placeholder="규정 검색 (예: 연차, 경조, 접대비)"></div><div id="rres"></div>'+
 '<div class="tabs">'+gs.map(x=>'<a href="#rules/'+encodeURIComponent(x)+'" class="'+(x===g?'on':'')+'">'+x+' '+RULES.groups[x].length+'</a>').join('')+'</div>'+
 sec(g,RULES.groups[g].length+'개','<div class="rules">'+RULES.groups[g].map(x=>'<details><summary>'+esc(x.title)+'</summary><p>'+esc(x.text)+'</p></details>').join('')+'</div>')}
function wireRules(){const q=$('#rq');if(!q)return;q.oninput=()=>{const k=q.value.trim();const out=$('#rres');if(!k){out.innerHTML='';return}
 const hit=[];for(const g in RULES.groups)RULES.groups[g].forEach(x=>{if((x.title+x.text).includes(k))hit.push([g,x])});
 out.innerHTML=sec('검색 결과 '+hit.length+'개','「'+esc(k)+'」','<div class="rules">'+hit.map(([g,x])=>'<details><summary>'+esc(x.title)+' <span class="tag">'+g+'</span></summary><p>'+esc(x.text).split(esc(k)).join('<mark>'+esc(k)+'</mark>')+'</p></details>').join('')+'</div>')}}

 const total=n=>(n.headcount||0)+(kids[n.name]||[]).reduce((a,c)=>a+total(c),0);

 '<div class="guide" style="background:var(--wait-50);border-color:#F2D7A6"><span class="nx" style="color:var(--wait)">인사팀 확인 필요 — M365 계정의 부서·상사 정보로 짠 조직도라 틀린 곳이 있을 수 있습니다 (예: 피플&컬처팀이 생산본부 아래로 잡힘). 숫자는 M365 계정 수입니다.</span>'+(st.role==='hr'?'<button class="btn sm" id="org_use">이 부서들을 EHR 부서 목록으로 쓰기</button>':'')+'</div>'+

 else if(r!=='hr')b+=sec('법정교육','','<div class="empty">올해 법정교육이 아직 열리지 않았습니다 (인사가 엽니다)</div>');
 return head('교육','법정 3대 교육 + 산업안전 · 매년 10~11월')+b+ruleBox(['법정 교육','안전 교육','교육 신청'])};

/* ---------- ERP 엑셀 ---------- */
const COLS={no:['사번','사원번호','사원코드','EMP_NO'],name:['성명','이름','사원명','한글성명'],dept:['부서','부서명','소속','소속부서','근무부서'],grade:['직급','직위','직급명'],pos:['직책','직책명'],join:['입사일','입사일자','그룹입사일'],emp:['고용형태','고용구분','사원구분','채용형태'],status:['재직구분','재직상태','재직여부','상태','근무상태']};
function xlsxReady(){return typeof XLSX!=='undefined'}
function erpImport(file){
 if(!xlsxReady()){toast('엑셀 읽기 도구를 불러오지 못했습니다 — 인터넷 연결 확인');return}
 file.arrayBuffer().then(buf=>{const wb=XLSX.read(buf,{cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length){toast('빈 파일입니다');return}const hs=Object.keys(rows[0]);const map={};for(const k in COLS){const h=hs.find(h=>COLS[k].includes(String(h).trim()));if(h)map[k]=h}
  if(!map.no||!map.name){toast('사번·성명 열을 찾지 못했습니다 (열 이름: '+hs.slice(0,6).join(', ')+')');return}
  let add=0,upd=0;const d2=v=>v instanceof Date?ymd(v):String(v).slice(0,10).replace(/\./g,'-');
  rows.forEach(r=>{const no=String(r[map.no]).trim();if(!no)return;let p=person(no);const st0=String(map.status?r[map.status]:'재직');
   const v={name:String(r[map.name]).trim(),dept:map.dept?String(r[map.dept]).trim():'미지정',grade:map.grade?String(r[map.grade]).trim():'',pos:map.pos&&String(r[map.pos]).trim()?String(r[map.pos]).trim():'팀원',join:map.join?d2(r[map.join]):'',emp:map.emp?String(r[map.emp]).trim():'정규',status:/퇴/.test(st0)?'퇴직':/휴/.test(st0)?'휴직':'재직'};
   if(v.dept&&!st.depts.includes(v.dept))st.depts.push(v.dept);
   if(p){Object.assign(p,v);upd++}else{st.people.push(Object.assign({no,base:0,allow:0},v));add++}});
  st.erp.push({id:nid(),dir:'받기',kind:'인원',desc:file.name+' — 새 '+add+' · 갱신 '+upd+' (열: '+Object.entries(map).map(([k,h])=>h).join(', ')+')',status:'반영 완료',at:now()});save();render();toast('ERP 사원 엑셀 반영: 새 '+add+'명 · 갱신 '+upd+'명','인원 명부 보기',()=>location.hash='#people')})}
function erpExportVouchers(){
 if(!xlsxReady()){toast('엑셀 도구를 불러오지 못했습니다');return}
 const rows=[['전표일자','전표번호','구분','적요','계정과목','차변금액','대변금액','ERP번호']];st.vouchers.forEach(v=>v.lines.forEach(l=>rows.push([v.date,v.no,v.kind,v.desc,l.acct,l.dr,l.cr,v.erpNo||''])));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'전표');XLSX.writeFile(wb,'KSystem_전표업로드_'+today()+'.xlsx')}
function erpTemplate(){if(!xlsxReady())return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['사번','성명','부서','직급','직책','입사일','고용형태','재직구분']]),'사원');XLSX.writeFile(wb,'ERP_사원_양식.xlsx')}

 document.querySelectorAll('[data-wfno]').forEach(b=>b.onclick=()=>{st.welfare.find(v=>v.id===+b.dataset.wfno).status='반려';save();render()});
 on('#edu_open',()=>{const y=String(new Date().getFullYear());const ps=st.people.filter(p=>p.status==='재직');if(!ps.length){toast('재직자가 없습니다');return}ps.forEach(p=>COURSES.forEach(([c])=>st.edus.push({id:nid(),year:y,no:p.no,course:c,done:''})));save();render();toast(ps.length+'명에게 4과정을 배정했습니다','직원으로 수강하기',()=>{st.me=ps[0].no;switchRole('emp','#edu')})});
 document.querySelectorAll('[data-edu]').forEach(b=>b.onclick=()=>{const e=st.edus.find(x=>x.id===+b.dataset.edu);e.done=now();save();render();toast(e.course+' 이수 완료')});
 on('#edu_nag',()=>{const n=new Set(st.edus.filter(e=>!e.done).map(e=>e.no)).size;toast(n?'미이수자 '+n+'명에게 알림을 보냈습니다 (시뮬레이션)':'미이수자가 없습니다')});
 const xi=$('#erp_xlsx');if(xi)xi.onchange=()=>{if(xi.files[0])erpImport(xi.files[0])};
 on('#erp_xout',erpExportVouchers);on('#erp_xtpl',erpTemplate);
}

/* ---------- 인사 담당자 실무: 출퇴근·52시간 · 월 마감 · 입퇴사 · 4대보험 · 연차 촉진 · 연말정산 · 일괄 처리 · 알림함 ---------- */
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n,day)=>{const d=new Date(s+'T00:00');const x=new Date(d.getFullYear(),d.getMonth()+n,day||d.getDate());return ymd(x)};
const dayLeft=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);
function dueTag(s,done){if(done)return '<span class="st o">완료</span>';const n=dayLeft(s);return '<span class="st '+(n<0?'n':n<=3?'w':'c')+'">'+(n<0?(-n)+'일 지남':n===0?'오늘까지':'D-'+n)+'</span> <span class="tag">'+s+'</span>'}
const hourly=p=>((p.base||0)+(p.allow||0))/209; // 통상시급 = 월 통상임금 ÷ 209시간
const RULE_NEED='<span class="st w" title="휴롬 규정에 숫자가 없어 지어내지 않았습니다">규정 확인 필요</span>';

/* 출퇴근 */
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function workMin(x){if(!x.in||!x.out)return 0;let a=toMin(x.in),b=toMin(x.out);if(b<a)b+=1440;let m=b-a;if(a<=720&&b>=780)m-=60;return Math.max(0,m)} // 휴게 12~13시
function weekStart(s){const d=new Date(s+'T00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function weekHours(no,ws){const we=addD(ws,6);return st.punches.filter(x=>x.no===no&&x.date>=ws&&x.date<=we).reduce((a,x)=>a+workMin(x),0)/60}
function otOfDay(x){const d=new Date(x.date+'T00:00').getDay(),m=workMin(x);return (d===0||d===6)?m/60:Math.max(0,m-480)/60}
function hClass(h){return h>52?'n':h>=48?'w':'o'}
V.work=(tab)=>{
 if(!st.people.length)return head('출퇴근·근무시간')+needP();
 const r=st.role,t=today(),ws=weekStart(t);let b='';
 const tabs=[['me','내 근무'],['flex','시차출퇴근'],['ot','연장·야간·휴일 신청'],['all','전체 현황']].filter(x=>r==='emp'?x[0]!=='all':x[0]!=='me');
 if(!tabs.find(x=>x[0]===tab))tab=tabs[0][0];
 b+='<div class="tabs">'+tabs.map(x=>'<a href="#work/'+x[0]+'" class="'+(x[0]===tab?'on':'')+'">'+x[1]+(r==='lead'&&(x[0]==='ot'?otQ():x[0]==='flex'?flexQ():[]).length?'<span class="n">'+(x[0]==='ot'?otQ():flexQ()).length+'</span>':'')+'</a>').join('')+'</div>';
 if(tab==='flex')b+=flexView();
 if(tab==='me'){const p=person(st.me),td=st.punches.find(x=>x.no===p.no&&x.date===t);const h=weekHours(p.no,ws);const fx=flexOf(p.no,t);
  b+='<div class="g2">'+sec('오늘 '+t.slice(5)+' ('+WD[new Date().getDay()]+')','오늘 '+fx+'유형 '+FLEX[fx].join('~')+' · 휴게 12~13시',
   '<div class="bal" style="grid-template-columns:1fr 1fr"><div><small>출근 '+(td?lateTag(td):'')+'</small><b>'+(td&&td.in||'—')+'</b></div><div><small>퇴근</small><b>'+(td&&td.out||'—')+'</b></div></div><div style="margin-top:12px;display:flex;gap:8px">'+

function ed(no,k,v,ty){return st.role==='hr'?'<input class="fld" type="'+ty+'" data-pe="'+no+'" data-k="'+k+'" value="'+esc(v)+'">':esc(v)}
function sel(no,k,v,opts){return st.role==='hr'?'<select class="fld" data-pe="'+no+'" data-k="'+k+'">'+opts.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':esc(v)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function twice(b){if(b.dataset.c)return true;b.dataset.c=1;b.textContent='한 번 더 누르기';setTimeout(()=>{delete b.dataset.c;b.textContent='지우기'},3000);return false}
function wireData(){
 const th=$('#tohr3');if(th)th.onclick=()=>switchRole('hr');
 document.querySelectorAll('[data-pe]').forEach(e=>e.onchange=()=>{const p=person(e.dataset.pe),k=e.dataset.k,v=e.value.trim();if(!v){e.value=p[k];return}
  p[k]=v;if(k==='status'&&v==='퇴직')p.leftAt=today();save();toast(p.name+' 저장했습니다');nav('data');guide()});
 document.querySelectorAll('[data-del-p]').forEach(b=>b.onclick=()=>{if(!twice(b))return;st.people=st.people.filter(p=>p.no!==b.dataset.delP);if(st.me===b.dataset.delP)st.me='';save();render()});
 document.querySelectorAll('[data-rs]').forEach(e=>e.onchange=()=>{const r=st.reqs.find(x=>x.id===+e.dataset.rs),old=r.status;r.status=e.value;act(r,'인사','인사 수정: '+old+' → '+r.status);save();toast('상태를 바꿨습니다');render()});
 document.querySelectorAll('[data-del-r]').forEach(b=>b.onclick=()=>{if(!twice(b))return;st.reqs=st.reqs.filter(r=>r.id!==+b.dataset.delR);save();render()});
 document.querySelectorAll('[data-dn]').forEach(e=>e.onchange=()=>{const i=+e.dataset.dn,o=st.depts[i],v=e.value.trim();if(!v||st.depts.includes(v)){e.value=o;return}st.depts[i]=v;st.people.forEach(p=>{if(p.dept===o)p.dept=v});save();toast(o+' → '+v);render()});
 document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{st.depts.splice(+b.dataset.dd,1);save();render()});
 const da=$('#dadd');if(da)da.onclick=()=>{const v=$('#dnew').value.trim();if(!v||st.depts.includes(v))return;st.depts.push(v);save();render();toast(v+' 부서를 추가했습니다')};
 const xj=$('#xjson');if(xj){xj.onclick=()=>dl('hurom-ehr-'+today()+'.json',JSON.stringify({people:st.people,reqs:st.reqs,depts:st.depts,seq:st.seq,pseq:st.pseq},null,1),'application/json');
  $('#xcsv1').onclick=()=>dl('EHR_인원.csv',csv([['사번','이름','부서','직책','직급','입사일','고용','상태','발생','사용','예약','잔여']].concat(st.people.map(p=>{const b=bal(p.no);return [p.no,p.name,p.dept,p.pos,p.grade,p.join,p.emp,p.status,b.grant,b.used,b.res,b.rem]}))),'text/csv');
  $('#xcsv2').onclick=()=>dl('EHR_근태신청.csv',csv([['번호','사번','이름','종류','시작','끝','일수','사유','상태','신청시각']].concat(st.reqs.map(r=>[r.id,r.no,(person(r.no)||{}).name,r.type,r.from,r.to,r.days,r.reason,r.status,r.at]))),'text/csv')}
 const ij=$('#ijson');if(ij)ij.onchange=()=>{const f=ij.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t.replace(/^﻿/,''));if(!Array.isArray(d.people)||!Array.isArray(d.reqs))throw 0;
  Object.assign(st,{people:d.people,reqs:d.reqs,depts:d.depts||st.depts,seq:d.seq||st.seq,pseq:d.pseq||st.pseq});save();toast('가져왔습니다: 인원 '+d.people.length+' · 신청 '+d.reqs.length);render()}catch(e){toast('파일 형식이 맞지 않습니다')}})}}

/* ---------- 그리기·이벤트 ---------- */
function render(){
 const h=(location.hash||'#dash').slice(1).split('/');const page=V[h[0]]?h[0]:'dash';
 nav(page);bar();guide();ensureTasks();bell();const v=$('#view');v.classList.remove('view');void v.offsetWidth;v.classList.add('view');v.innerHTML=V[page](h[1]);wire(page);window.scrollTo(0,0)}
function wire(page){
 document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>location.hash=e.dataset.go);
 const th=$('#tohr')||$('#tohr2');if(th)th.onclick=()=>switchRole('hr','#people');
 const cs=$('#c_sel');if(cs)cs.onchange=()=>location.hash='#card/'+cs.value;
 document.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{const p=person((location.hash.split('/')[1])||st.people[0].no);p.status=b.dataset.ps;if(p.status==='퇴직')p.leftAt=today();save();toast(p.name+' 상태를 '+p.status+'(으)로 바꿨습니다');render()});
 const add=$('#p_add');if(add)add.onclick=()=>{const name=$('#p_name').value.trim();if(!name){$('#p_err').textContent='이름을 넣으세요';return}
  const join=$('#p_join').value;if(!join){$('#p_err').textContent='입사일을 고르세요';return}
  const no='H'+String(st.pseq++).padStart(4,'0');st.people.push({no,name,dept:$('#p_dept').value,pos:$('#p_pos').value,grade:$('#p_grade').value,join,emp:$('#p_emp').value,status:'재직',base:+$('#p_base').value||0,allow:+$('#p_allow').value||0});addMove(no,'입사',join,'신규 입사');
  if(!st.me)st.me=no;save();render();toast(name+' 등록했습니다 (사번 '+no+')','직원 '+name+'(으)로 신청하기',()=>{st.me=no;switchRole('emp','#leave/new')})};
 const ty=$('#types');if(ty){
  const upd=()=>{draft.from=$('#f_from').value;draft.to=$('#f_to').value;draft.reason=$('#f_reason').value;const d=calcDays();$('#f_days').value=TYPES[draft.type].deduct?d+'일':d+'일 (연차 차감 없음)';$('#f_err').textContent=validate()};
  ty.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.type=b.dataset.t;draft.from=$('#f_from').value;draft.to=$('#f_to').value;draft.reason=$('#f_reason').value;render()});
  ['#f_from','#f_to','#f_reason'].forEach(s=>$(s).oninput=upd);upd();
  $('#f_send').onclick=()=>{const e=validate();if(e){$('#f_err').textContent=e;return}const p=person(st.me),tyd=TYPES[draft.type],f=$('#f_from').value,t=tyd.days===0.5?f:$('#f_to').value;
   const r={id:st.seq++,no:p.no,type:draft.type,from:f,to:t,days:calcDays(),reason:$('#f_reason').value.trim(),status:S.LEAD,at:now(),retro:f<today(),hist:[]};
   act(r,p.name,'신청');st.reqs.push(r);draft={type:'연차'};save();
   toast(p.name+' '+r.type+' 신청했습니다 → '+stepName(r)+' 대기','팀장으로 승인하기',()=>switchRole('lead','#leave/approve'));location.hash='#leave/mine';render()}}
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAct(b.dataset.a,+b.dataset.id));if(page==='data')wireData();wireMods(page);wireMods2(page);wireMods3(page);if(page==='erp')wireErp()}
function doAct(a,id){
 const r=st.reqs.find(x=>x.id===id);if(!r)return;const p=person(r.no)||{};const sn=stepName(r).replace(' 승인','');let msg='',nb='',go=null;
 const memo=(a==='no'||a==='hrno'||a==='clno')?prompt2():'';
 if(a==='ok'){r.status=S.HR;act(r,sn,sn+' 승인 (연차 예약)');msg='승인했습니다 → 인사 확정 대기';nb='인사로 확정하기';go=()=>switchRole('hr','#leave/hr')}
 if(a==='no'){r.status=S.NO;act(r,sn,sn+' 반려',memo);msg='반려했습니다';nb='직원 화면 보기';go=()=>{st.me=r.no;switchRole('emp','#leave/mine')}}
 if(a==='hrok'){r.status=S.OK;act(r,'인사','인사 확정 (연차 사용)');msg='확정했습니다 → 연차 사용으로 반영';nb='인사카드 보기';go=()=>location.hash='#card/'+r.no}
 if(a==='hrno'){r.status=S.NO;act(r,'인사','인사 반려',memo);msg='반려했습니다 → 예약 풀림'}
 if(a==='wd'){r.status=S.WD;act(r,p.name,'회수');msg='회수했습니다'}
 if(a==='cl'){r.status=S.CL;act(r,p.name,'취소 요청');msg='취소 요청했습니다 → '+sn+' 대기';nb='팀장으로 처리하기';go=()=>switchRole('lead','#leave/approve')}
 if(a==='clok'){r.status=S.CH;act(r,sn,'취소 '+sn+' 승인');msg='취소를 승인했습니다 → 인사 확정 대기';nb='인사로 확정하기';go=()=>switchRole('hr','#leave/hr')}
 if(a==='clno'){r.status=S.OK;act(r,sn,'취소 반려',memo);msg='취소 요청을 반려했습니다'}
 if(a==='chok'){r.status=S.CX;act(r,'인사','취소 확정 (연차 돌려줌)');msg='취소 확정 → 연차를 돌려줬습니다'}
 if(a==='re'){draft={type:r.type,from:r.from,to:r.to,reason:r.reason};save();location.hash='#leave/new';return}
 save();render();toast((p.name||'')+' '+r.type+': '+msg,nb,go)}
function prompt2(){const v=window.__memo||'';window.__memo='';return v} // 반려 사유는 줄 안 입력창에서 받음
// 반려 사유: 버튼을 누르기 전 같은 줄에 입력창을 띄움
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="no"],[data-a="hrno"],[data-a="clno"]');if(!b||b.dataset.ready)return;
 e.stopImmediatePropagation();e.preventDefault();const td=b.parentElement;const a=b.dataset.a,id=b.dataset.id;
 td.innerHTML='<input class="fld" id="memo" placeholder="반려 사유" style="border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:140px"> <button class="btn no sm" data-a="'+a+'" data-id="'+id+'" data-ready="1">반려</button> <button class="btn sm" id="mcancel">취소</button>';
 const m=td.querySelector('#memo');m.focus();td.querySelector('#mcancel').onclick=()=>render();
 td.querySelector('[data-ready]').onclick=()=>{window.__memo=m.value.trim()||'사유 없음';doAct(a,+id)}},true);
$('#reset').onclick=()=>{const b=$('#reset');if(b.dataset.c){localStorage.removeItem(KEY);st=blank();draft={type:'연차'};b.textContent='처음부터 다시';delete b.dataset.c;location.hash='#dash';render();toast('처음 상태로 돌렸습니다');return}
 b.dataset.c=1;b.textContent='정말 지울까요? 한 번 더 누르기';b.classList.add('no');setTimeout(()=>{b.textContent='처음부터 다시';delete b.dataset.c;b.classList.remove('no')},4000)};
window.addEventListener('hashchange',render);render();
})();
</script>
</body></html>
