<script>
(function(){
const KEY='hurom-ehr-sim-v1';
const TYPES={'연차':{days:'range',deduct:true},'오전반차':{days:0.5,deduct:true},'오후반차':{days:0.5,deduct:true},'외근':{days:'range',deduct:false},'경조휴가':{days:'range',deduct:false},'병가':{days:'range',deduct:false},'공가':{days:'range',deduct:false},'대체휴무':{days:'range',deduct:false}};
const DEPTS=['경영지원팀','인사팀','상품기획팀','연구개발팀','디자인팀','영업팀','마케팅팀','품질팀','생산팀'];
const S={LEAD:'팀장 대기',HR:'인사 대기',OK:'확정',NO:'반려',CL:'취소요청',CH:'취소 인사 대기',CX:'취소됨',WD:'회수'};
let st=load();SIMD=st.simDate||'';
function blank(){return {people:[],reqs:[],depts:DEPTS.slice(),role:'hr',me:'',seq:1,pseq:1,moves:[],pays:[],vouchers:[],exps:[],certs:[],evals:[],jobs:[],apps:[],xseq:1,erp:[],accts:[],welfare:[],edus:[],punches:[],ots:[],flex:[],closes:[],bonus:{},tasks:[],contracts:{},notices:[],ye:[],stock:[],juice:[],memos:[],xedu:[],lvreq:[],lic:[],audit:[],deputy:[],alerts:[],autolog:[],lvplans:[],lvdraft:[],hunet:[],forms:[],pt:[],autoOff:{},simDate:'',rates:{np:4.75,hi:3.595,ltc:13.14,ei:0.9,tax:3}}}
function load(){try{const d=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY))||{});if(!d.depts||!d.depts.length)d.depts=DEPTS.slice();return d}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>SIMD||ymd(new Date());

function workdays(a,b){let n=0;const d=new Date(a+'T00:00');const e=new Date(b+'T00:00');while(d<=e){const w=d.getDay();if(w&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
function person(no){return st.people.find(p=>p.no===no)}
function grant(p){ // 근로기준법 기준 연차 발생
 if(!p||!p.join)return 0;const j=new Date((p.sumTenure&&p.career&&p.career.length?p.career[0].from:p.join)+'T00:00'),t=new Date();
 let m=(t.getFullYear()-j.getFullYear())*12+(t.getMonth()-j.getMonth());if(t.getDate()<j.getDate())m--;
 if(m<0)return 0;if(m<12)return Math.min(m,11);const y=Math.floor(m/12);return Math.min(25,15+Math.floor((y-1)/2))}
function bal(no){
 const p=person(no);let used=0,res=0,pend=0;
 st.reqs.filter(r=>r.no===no&&TYPES[r.type].deduct).forEach(r=>{
  if(r.status===S.OK||r.status===S.CL||r.status===S.CH)used+=r.days;
  else if(r.status===S.HR)res+=r.days;else if(r.status===S.LEAD)pend+=r.days});
 const g=grant(p);return {grant:g,used,res,pend,rem:g-used-res}}

function steps(r){

 if(r.status===S.LEAD)a.push([sn,'cur'],['인사 확정','']);
 else if(r.status===S.NO){const by=r.hist.slice(-1)[0];a.push([by&&by.act.includes('인사')?sn:sn+' 반려',by&&by.act.includes('인사')?'d':'x']);if(by&&by.act.includes('인사'))a.push(['인사 반려','x'])}

 else{a.push([sn,'d']);if(r.status===S.HR)a.push(['인사 확정','cur']);else{a.push(['인사 확정','d']);
  if(r.status===S.CL)a.push(['취소 '+sn,'cur'],['취소 확정','']);if(r.status===S.CH)a.push(['취소 '+sn,'d'],['취소 확정','cur']);if(r.status===S.CX)a.push(['취소 확정','d'])}}
 return '<div class="line">'+a.map((x,i)=>(i?'›':'')+'<span class="step '+x[1]+'">'+x[0]+'</span>').join('')+'</div>'}

const GR=s=>s>=4.5?'S':s>=3.5?'A':s>=2.5?'B':s>=1.5?'C':'D';

 const list=(r==='emp'?st.evals.filter(e=>e.no===st.me):st.evals);
 return head('평가','인사가 시작 → 직원 자기평가 → 팀장 평가 → 인사 확정(등급)')+b+sec('평가 현황',cycles.length+'회 · '+list.length+'건',tbl(['평가','대상','부서','상태','자기','팀장','등급'],list.map(e=>{const p=person(e.no)||{};return '<tr><td>'+esc(e.cycle)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.dept)+'</td><td>'+stB(e.status)+'</td><td>'+(e.self?e.self.s:'—')+'</td><td>'+(e.lead?e.lead.s:'—')+'</td><td><b>'+(e.grade||'—')+'</b></td></tr>'}),'평가가 없습니다'+(r!=='hr'?' (인사가 시작합니다)':'')))};

/* ---------- 조직 개편 · 인사발령 대장 (곽두팔 「휴롬엘에스_조직도.html」 동작을 옮김 · 공개 주소라 조직장 실명 없음) ---------- */
const ORG_BASE="대표\n  고객가치 실현위원회 #위원회\n  개인정보보호 TF #위원회\n  산청 TF #위원회\n  AX팀 #직속\n  유럽법인 #법인\n  미국법인 #법인\n  중국법인 #법인\n  일본법인 #법인\n  말레이시아지사 #법인\n  글로벌전략실\n    글로벌전략1팀\n    글로벌전략2팀\n    글로벌전략3팀\n  마케팅본부\n    마케팅팀\n    퍼포먼스마케팅팀\n    커뮤니케이션디자인팀\n    식품영양연구팀\n  해외영업본부\n    해외영업팀\n  국내영업본부\n    국내영업팀\n    미디어커머스팀\n  고객경영본부\n    운영기획팀\n    AS팀\n    고객만족팀\n  상품전략본부\n    상품전략1팀\n    상품전략2팀\n    상품디자인팀\n  F&B사업본부\n    F&B사업1팀\n    F&B사업2팀\n    F&B센터\n  지식재산본부\n    지식재산1팀\n  법무본부\n    법무감사팀\n  경영지원본부\n    재무팀\n    물류팀\n    ESG경영팀\n  HR본부\n    피플&컬처팀\n    자산관리팀";
const RG={
 dot:d=>{const [y,m,dd]=d.split('-');return y+'. '+(+m)+'. '+(+dd)},
 jong:w=>{const c=w.charCodeAt(w.length-1);if(c<0xac00||c>0xd7a3)return /[136780LMNRlmnr]$/.test(w);return (c-0xac00)%28>0},
 J:(w,a,b)=>w+(RG.jong(w)?a:b),
 ro:w=>w+(RG.jong(w)?'으로':'로'),
 parse(txt){const out=[],sk=[];
  txt.split(/\r?\n/).forEach(l=>{if(!l.trim())return;const dep=Math.floor(l.match(/^ */)[0].length/2);
   let b=l.trim(),tag='',old=null;const t=b.match(/\s#(\S+)\s*$/);if(t){tag=t[1];b=b.slice(0,t.index).trim()}
   const r=b.split('<-');if(r.length>1){b=r[0].trim();old=r[1].trim()}
   const [nm,ld]=b.split('|').map(x=>(x||'').trim());
   sk.length=dep;const n={nm,ld:ld||'',tag,old,dep,parent:dep?(sk[dep-1]||{}).nm||null:null,kids:[]};
   if(dep&&sk[dep-1])sk[dep-1].kids.push(n);sk[dep]=n;out.push(n)});return out},
 who(ld){if(!ld)return null;let s=ld.replace(/\[[^\]]*\]\s*/g,'').trim();const kyum=/\(겸\)\s*$/.test(s);s=s.replace(/\(겸\)\s*$/,'').trim();
  const p=s.split(/\s+/);if(p.length<2)return {name:s,title:'',kyum};return {name:p.slice(0,-1).join(' '),title:p[p.length-1],kyum}},
 roleT:o=>/법인$/.test(o)?'법인장':/지사$/.test(o)?'지사장':/센터$/.test(o)?'센터장':/본부$/.test(o)?'본부장':/실$/.test(o)?'실장':/팀$/.test(o)?'팀장':'장',
 people(N){const P={};N.forEach(n=>{const w=RG.who(n.ld);if(!w)return;(P[w.name]=P[w.name]||{title:'',roles:[]});const p=P[w.name];
  const r={org:n.nm,t:RG.roleT(n.nm),kyum:w.kyum};if(!w.kyum){p.roles.unshift(r);p.title=w.title}else p.roles.push(r);if(!p.title)p.title=w.title});return P},
 RK:r=>/본부$|실$/.test(r.org)?0:/팀$|센터$/.test(r.org)?1:2,
 roleStr:p=>[p.roles[0],...p.roles.slice(1).sort((x,y)=>RG.RK(x)-RG.RK(y))].map((r,i)=>(i?'겸 ':'')+r.org+' '+r.t),
 compress(names){const m=names.map(n=>n.match(/^(.*?)(\d+)(\D+)$/));
  if(m.every(x=>x)&&m.every(x=>x[1]===m[0][1]&&x[3]===m[0][3]))return m.map((x,i)=>i?x[2]+x[3]:x[0]).join('·');return names.join('·')},
 diff(A,B){const ma=new Map(A.map(x=>[x.nm,x])),mb=new Map(B.map(x=>[x.nm,x]));const J=RG.J;
  const RN={};B.forEach(b=>{if(b.old&&ma.has(b.old))RN[b.old]=b.nm});const tr=p=>RN[p]||p;
  const added=B.filter(b=>!ma.has(b.nm)&&!b.old),removed=A.filter(a=>!mb.has(a.nm)&&!RN[a.nm]);
  const ev=[],mergeTo={},used=new Set();
  const byP={};removed.forEach(r=>(byP[tr(r.parent)]=byP[tr(r.parent)]||[]).push(r));
  Object.entries(byP).forEach(([p,rs])=>{const ad=added.filter(a=>a.parent===p&&!used.has(a.nm));
   if(rs.length>=2&&ad.length===1){ev.push({k:'통합',txt:p+' 내 '+J(RG.compress(rs.map(r=>r.nm)),'을','를')+' '+RG.ro(ad[0].nm)+' 통합함'});rs.forEach(r=>{mergeTo[r.nm]=ad[0].nm;used.add(r.nm)});used.add(ad[0].nm)}
   else if(rs.length===1&&ad.length===1){ev.push({k:'명칭 변경',txt:p+' 내 '+J(rs[0].nm,'을','를')+' '+RG.ro(ad[0].nm)+' 명칭 변경함'});mergeTo[rs[0].nm]=ad[0].nm;used.add(rs[0].nm);used.add(ad[0].nm)}});
  B.filter(b=>b.old&&ma.has(b.old)).forEach(b=>{ev.push({k:'명칭 변경',txt:J(b.old,'을','를')+' '+RG.ro(b.nm)+' 명칭 변경함'});mergeTo[b.old]=b.nm});
  added.filter(a=>!used.has(a.nm)).forEach(a=>ev.push({k:'신설',txt:(a.parent&&a.parent!=='대표'?a.parent+' 내 ':'')+J(a.nm,'을','를')+' 신설함'}));
  removed.filter(r=>!used.has(r.nm)).forEach(r=>ev.push({k:'폐지',txt:(r.parent&&r.parent!=='대표'?r.parent+' 내 ':'')+J(r.nm,'을','를')+' 폐지함'}));
  B.forEach(b=>{const a=ma.get(b.old||b.nm);if(a&&tr(a.parent)!==b.parent)ev.push({k:'이관',txt:J(b.nm,'을','를')+' '+a.parent+'에서 '+RG.ro(b.parent)+' 이관함'})});
  const PA=RG.people(A),PB=RG.people(B),boim=[],move=[];
  new Set([...Object.keys(PA),...Object.keys(PB)]).forEach(n=>{const a=PA[n],b=PB[n];const sa=a?RG.roleStr(a).join('|'):'',sb=b?RG.roleStr(b).join('|'):'';if(sa===sb)return;
   if(b)boim.push({name:n,title:(b||a).title,before:a?RG.roleStr(a):['-'],after:RG.roleStr(b),multi:b.roles.length>1,org:b.roles[0].org,t:b.roles[0].t});
   else{const org=a.roles[0].org;move.push({name:n,title:'-',before:[org+' '+a.roles[0].t],after:[mergeTo[org]||'(발령 부서 입력)'],todo:!mergeTo[org],org:mergeTo[org]||''})}});
  return {ev,boim,move,mergeTo,changed:new Set([...added.map(x=>x.nm),...B.filter(b=>b.old).map(b=>b.nm)]),mod:new Set(B.filter(b=>{const a=ma.get(b.old||b.nm);return a&&a.ld!==b.ld}).map(b=>b.nm))}},
 chart(N,date,title,D){const root=N.find(n=>!n.dep)||{kids:[]};const K=root.kids;
  const com=K.filter(k=>k.tag==='위원회'),dir=K.filter(k=>k.tag==='직속'),sub=K.filter(k=>k.tag==='법인'),div=K.filter(k=>!k.tag);
  const cls=n=>D?(D.changed.has(n.nm)?' chg-add':D.mod.has(n.nm)?' chg-mod':''):'';
  const bx=(n,h)=>'<div class="bx'+(h?' h':'')+cls(n)+'">'+esc(n.nm)+(n.ld?'<small>'+esc(n.ld)+'</small>':'')+'</div>';
  const L='calc(100% / '+(2*Math.max(div.length,1))+')';
  return '<div class="oc"><div class="bar"><span>'+esc(title)+'</span><span>'+RG.dot(date)+'자</span></div><div class="conf">대외비</div>'+
  (com.length?'<div class="com">'+com.map(c=>'<div>'+esc(c.nm)+'</div>').join('')+'</div>':'')+
  '<div class="ceo">'+esc(root.nm||'대표')+'</div><div class="mid"><div class="trunk"></div><div class="dir">'+dir.map(d=>bx(d)).join('')+'</div>'+
  (sub.length?'<div class="subs" style="--rw:67px">'+sub.map(s=>bx(s)).join('')+'</div>':'')+'</div>'+
  '<div class="divs" style="grid-template-columns:repeat('+div.length+',1fr);--l:'+L+'">'+div.map(d=>'<div class="col">'+bx(d,1)+d.kids.map(k=>bx(k)).join('')+'</div>').join('')+'</div></div>'},
 ppl(txt){const mv=[],im=[];(txt||'').split(/\r?\n/).forEach(l=>{const p=l.split('|').map(x=>x.trim());if(p.length<3)return;

 else if(r!=='hr')b+=sec('법정교육','','<div class="empty">올해 법정교육이 아직 열리지 않았습니다 (인사가 엽니다)</div>');
 return head('교육','법정 3대 교육 + 산업안전 · 매년 10~11월 · 대한산업안전협회 원격교육센터')+b};

/* ---------- ERP 엑셀 ---------- */
const COLS={no:['사번','사원번호','사원코드','EMP_NO'],name:['성명','이름','사원명','한글성명'],dept:['부서','부서명','소속','소속부서','근무부서'],grade:['직급','직위','직급명'],pos:['직책','직책명'],join:['입사일','입사일자','그룹입사일'],emp:['고용형태','고용구분','사원구분','채용형태'],status:['재직구분','재직상태','재직여부','상태','근무상태']};
function xlsxReady(){return typeof XLSX!=='undefined'}
function erpImport(file){
 if(!xlsxReady()){toast('엑셀 읽기 도구를 불러오지 못했습니다 — 인터넷 연결 확인');return}
 file.arrayBuffer().then(buf=>{const wb=XLSX.read(buf,{cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length){toast('빈 파일입니다');return}const hs=Object.keys(rows[0]);const map={};for(const k in COLS){const h=hs.find(h=>COLS[k].includes(String(h).trim()));if(h)map[k]=h}
  if(!map.no||!map.name){toast('사번·성명 열을 찾지 못했습니다 (열 이름: '+hs.slice(0,6).join(', ')+')');return}
  let add=0,upd=0;const d2=v=>v instanceof Date?ymd(v):String(v).slice(0,10).replace(/\./g,'-');
  rows.forEach(r=>{const no=String(r[map.no]).trim();if(!no)return;let p=person(no);const st0=String(map.status?r[map.status]:'재직');
   const v={name:String(r[map.name]).trim(),dept:map.dept?String(r[map.dept]).trim():'미지정',grade:map.grade?String(r[map.grade]).trim():'',pos:map.pos&&String(r[map.pos]).trim()?String(r[map.pos]).trim():'팀원',join:map.join?d2(r[map.join]):'',emp:map.emp?String(r[map.emp]).trim():'정규',status:/퇴/.test(st0)?'퇴직':/휴/.test(st0)?'휴직':'재직'};
   if(v.dept&&!st.depts.includes(v.dept))st.depts.push(v.dept);
   if(p){Object.assign(p,v);upd++}else{st.people.push(Object.assign({no,base:0,allow:0},v));add++}});
  st.erp.push({id:nid(),dir:'받기',kind:'인원',desc:file.name+' — 새 '+add+' · 갱신 '+upd+' (열: '+Object.entries(map).map(([k,h])=>h).join(', ')+')',status:'반영 완료',at:now()});save();render();toast('ERP 사원 엑셀 반영: 새 '+add+'명 · 갱신 '+upd+'명','인원 명부 보기',()=>location.hash='#people')})}
function erpExportVouchers(){
 if(!xlsxReady()){toast('엑셀 도구를 불러오지 못했습니다');return}
 const rows=[['전표일자','전표번호','구분','적요','계정과목','차변금액','대변금액','ERP번호']];st.vouchers.forEach(v=>v.lines.forEach(l=>rows.push([v.date,v.no,v.kind,v.desc,l.acct,l.dr,l.cr,v.erpNo||''])));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'전표');XLSX.writeFile(wb,'KSystem_전표업로드_'+today()+'.xlsx')}
function erpTemplate(){if(!xlsxReady())return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['사번','성명','부서','직급','직책','입사일','고용형태','재직구분']]),'사원');XLSX.writeFile(wb,'ERP_사원_양식.xlsx')}

 on('#edu_nag',()=>{const n=new Set(st.edus.filter(e=>!e.done).map(e=>e.no)).size;toast(n?'미이수자 '+n+'명에게 알림을 보냈습니다 (시뮬레이션)':'미이수자가 없습니다')});
 const xi=$('#erp_xlsx');if(xi)xi.onchange=()=>{if(xi.files[0])erpImport(xi.files[0])};

}

/* ---------- 인사 담당자 실무: 출퇴근·52시간 · 월 마감 · 입퇴사 · 4대보험 · 연차 촉진 · 연말정산 · 일괄 처리 · 알림함 ---------- */
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const addM=(s,n,day)=>{const d=new Date(s+'T00:00');const x=new Date(d.getFullYear(),d.getMonth()+n,day||d.getDate());return ymd(x)};
const dayLeft=s=>Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);
function dueTag(s,done){if(done)return '<span class="st o">완료</span>';const n=dayLeft(s);return '<span class="st '+(n<0?'n':n<=3?'w':'c')+'">'+(n<0?(-n)+'일 지남':n===0?'오늘까지':'D-'+n)+'</span> <span class="tag">'+s+'</span>'}
const hourly=p=>((p.base||0)+(p.allow||0))/209; // 통상시급 = 월 통상임금 ÷ 209시간
const RULE_NEED='<span class="st w" title="휴롬 규정에 숫자가 없어 지어내지 않았습니다">규정 확인 필요</span>';

/* 출퇴근 */
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function workMin(x){if(!x.in||!x.out)return 0;let a=toMin(x.in),b=toMin(x.out);if(b<a)b+=1440;let m=b-a;if(a<=720&&b>=780)m-=60;return Math.max(0,m)} // 휴게 12~13시
function weekStart(s){const d=new Date(s+'T00:00');const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)}
function weekHours(no,ws){const we=addD(ws,6);return st.punches.filter(x=>x.no===no&&x.date>=ws&&x.date<=we).reduce((a,x)=>a+workMin(x),0)/60}
function otOfDay(x){const d=new Date(x.date+'T00:00').getDay(),m=workMin(x);return (d===0||d===6)?m/60:Math.max(0,m-480)/60}
function hClass(h){return h>52?'n':h>=48?'w':'o'}

 if(!st.people.length)return head('출퇴근·근무시간')+needP();

 const tabs=[['me','내 근무'],['flex','시차출퇴근'],['ot','연장·야간·휴일 신청'],['all','전체 현황']].filter(x=>r==='emp'?x[0]!=='all':x[0]!=='me');
 if(!tabs.find(x=>x[0]===tab))tab=tabs[0][0];
 b+='<div class="tabs">'+tabs.map(x=>'<a href="#work/'+x[0]+'" class="'+(x[0]===tab?'on':'')+'">'+x[1]+(r==='lead'&&(x[0]==='ot'?otQ():x[0]==='flex'?flexQ():[]).length?'<span class="n">'+(x[0]==='ot'?otQ():flexQ()).length+'</span>':'')+'</a>').join('')+'</div>';
 if(tab==='flex')b+=flexView();
 if(tab==='me'){const p=person(st.me),td=st.punches.find(x=>x.no===p.no&&x.date===t);const h=weekHours(p.no,ws);const fx=flexOf(p.no,t);
  b+='<div class="g2">'+sec('오늘 '+t.slice(5)+' ('+WD[new Date().getDay()]+')','오늘 '+fx+'유형 '+FLEX[fx].join('~')+' · 휴게 12~13시',
   '<div class="bal" style="grid-template-columns:1fr 1fr"><div><small>출근 '+(td?lateTag(td):'')+'</small><b>'+(td&&td.in||'—')+'</b></div><div><small>퇴근</small><b>'+(td&&td.out||'—')+'</b></div></div><div style="margin-top:12px;display:flex;gap:8px">'+
   (!td?'<button class="btn p" id="pin">출근</button>':!td.out?'<button class="btn p" id="pout">퇴근</button>':'<span class="tag">오늘 기록 끝</span>')+'</div>')+
  sec('이번 주 근무','월 '+ws.slice(5)+' ~ 일 '+addD(ws,6).slice(5),'<div class="bal" style="grid-template-columns:1fr"><div class="rem"><small>누계</small><b>'+h.toFixed(1)+'</b>시간 <span class="st '+hClass(h)+'">'+(h>52?'52시간 초과':h>=48?'48시간 넘음 · 주의':'정상')+'</span></div></div><div class="tr" style="margin-top:10px"><i style="width:'+Math.min(100,h/52*100)+'%;background:'+(h>52?'var(--no)':h>=48?'var(--wait)':'')+'"></i></div><div class="tag" style="margin-top:6px">법정 한도 주 52시간(기본 40 + 연장 12)</div>')+'</div>';
  b+=sec('기록 넣기·고치기','찍지 못한 날은 여기서 넣습니다 (시뮬레이션: 지난 날도 됨)','<div class="form"><label>날짜<input id="pk_d" type="date" value="'+t+'"></label><label>출근<input id="pk_i" type="time" value="'+FLEX[fx][0]+'"></label><label>퇴근<input id="pk_o" type="time" value="'+FLEX[fx][1]+'"></label></div><div class="err" id="pk_err"></div><button class="btn" id="pk_go">저장</button> <button class="btn sm" id="pk_wk" title="이번 주 월~금을 09:00~18:00으로 채웁니다">이번 주 평일 채우기</button>');
  const mine=st.punches.filter(x=>x.no===p.no).sort((a,c)=>a.date<c.date?1:-1).slice(0,14);
  b+=sec('최근 기록',mine.length+'일',tbl(['날짜','유형','출근','퇴근','근무','연장',''],mine.map(x=>'<tr><td>'+x.date+' ('+WD[new Date(x.date+'T00:00').getDay()]+')</td><td>'+flexOf(x.no,x.date)+'</td><td>'+x.in+'</td><td>'+(x.out||'—')+'</td><td>'+(workMin(x)/60).toFixed(1)+'h</td><td>'+(otOfDay(x)?otOfDay(x).toFixed(1)+'h':'')+'</td><td>'+lateTag(x)+'</td></tr>'),'기록이 없습니다'))}
 if(tab==='ot'){
  if(r==='emp'){const p=person(st.me);b+=sec('시간외근로 신청',esc(p.name)+' · 팀장 승인 → 급여 수당','<div class="form"><label>날짜<input id="o_d" type="date" value="'+t+'"></label><label>종류<select id="o_k"><option>야근</option><option>조근</option><option>휴일근로</option></select></label><label>시간<input id="o_h" type="number" step="0.5" min="0.5" max="12" value="2"></label><label>그중 22시 이후 (야간)<input id="o_n" type="number" step="0.5" min="0" value="0"></label><label class="full">사유<input id="o_r" placeholder="예: 신제품 출시 준비"></label></div><div class="err" id="o_err"></div><button class="btn p" id="o_go">신청</button>')+ruleBox(['근태계 작성법','기본규정'])}

 if(tab==='all'){const act=actives();const ym=t.slice(0,7);
  const rows=act.map(p=>({p,h:weekHours(p.no,ws),ot:st.punches.filter(x=>x.no===p.no&&x.date.slice(0,7)===ym).reduce((a,x)=>a+otOfDay(x),0)})).sort((a,c)=>c.h-a.h);

function callName(p){return p.pos&&p.pos!=='팀원'?p.name+' '+p.pos:p.name+'님'} // 커리어레벨 규정: 팀원은 「님」, 직책자는 직책 호칭
const yrs=(a,b)=>Math.max(0,(new Date((b||today())+'T00:00')-new Date(a+'T00:00'))/31557600000);
function tenure(p){const cur=yrs(p.join,p.status==='퇴직'?p.leftAt:'');const prev=(p.career||[]).reduce((a,c)=>a+yrs(c.from,c.to),0);return {cur,prev,sum:p.sumTenure?cur+prev:cur}}

 if(l&&l.who===who&&l.no===no&&l.what===what&&l.at===now())return;st.audit.push({at:now(),who,role:roleName[st.role],no,what});if(st.audit.length>2000)st.audit.shift();save()}

  else out.push([p,'입사 처리 전','#onoff/in'])});
 return {due,out}}

/* ---------- 데이터 관리 ---------- */
V.data=(tab)=>dataView(tab);
const DT=[['people','인원 (EHR_인원)'],['reqs','근태 신청 (EHR_근태신청)'],['hist','결재 이력 (EHR_결재이력)'],['depts','부서 (EHR_부서)'],['moves','발령'],['pays','급여'],['vouchers','전표'],['exps','경비'],['certs','증명서'],['evals','평가'],['apps','채용'],['rates','요율'],['backup','백업·가져오기']];
function dataView(tab){
 if(!DT.find(t=>t[0]===tab))tab='people';const hr=st.role==='hr';
 let body=hr?'<div style="text-align:right;margin-bottom:10px"><button class="btn sm" id="reset" title="이 브라우저에 저장된 시뮬레이션 데이터를 모두 지웁니다">처음부터 다시</button></div>':'';
 if(!hr)body='<div class="guide"><span class="nx">데이터 관리는 인사 역할만 고칠 수 있습니다. 지금은 보기만 됩니다.</span><button class="btn sm" id="tohr3">인사로 보기</button></div>';
 if(tab==='people')body+=card2('인원 '+st.people.length+'명','칸을 고치면 바로 저장됩니다 · 신청 기록이 있는 사람은 지우지 않고 퇴직으로 둡니다',
  st.people.length?'<table><tr><th>사번</th><th>이름</th><th>부서</th><th>직책</th><th>직급</th><th>입사일</th><th>고용</th><th>상태</th><th class="right">신청</th><th></th></tr>'+st.people.map(p=>{const n=st.reqs.filter(r=>r.no===p.no).length;
  return '<tr><td>'+p.no+'</td><td>'+ed(p.no,'name',p.name,'text')+'</td><td>'+sel(p.no,'dept',p.dept,st.depts)+'</td><td>'+sel(p.no,'pos',p.pos,['팀원','팀장','본부장'])+'</td><td>'+sel(p.no,'grade',p.grade,['사원','주임','대리','과장','차장','부장'])+'</td><td>'+ed(p.no,'join',p.join,'date')+'</td><td>'+sel(p.no,'emp',p.emp,['정규','계약'])+'</td><td>'+sel(p.no,'status',p.status,['재직','휴직','퇴직'])+'</td><td class="right">'+n+'</td><td class="right">'+(hr&&!n?'<button class="btn no sm" data-del-p="'+p.no+'">지우기</button>':'')+'</td></tr>'}).join('')+'</table>':'<div class="empty">인원이 없습니다<br><a class="btn sm" href="#people">인원 등록</a></div>');
 if(tab==='reqs')body+=card2('근태 신청 '+st.reqs.length+'건','상태를 직접 바꾸면 결재 이력에 「인사 수정」으로 남습니다',
  st.reqs.length?'<table><tr><th>번호</th><th>신청자</th><th>종류</th><th>시작</th><th>끝</th><th class="right">일수</th><th>사유</th><th>상태</th><th>신청 시각</th><th></th></tr>'+st.reqs.map(r=>{const p=person(r.no)||{};
  return '<tr><td>'+r.id+'</td><td>'+esc(p.name)+'</td><td>'+r.type+'</td><td>'+r.from+'</td><td>'+r.to+'</td><td class="right">'+r.days+'</td><td>'+esc(r.reason)+'</td><td>'+(hr?'<select class="fld" data-rs="'+r.id+'">'+Object.values(S).map(v=>'<option'+(v===r.status?' selected':'')+'>'+v+'</option>').join('')+'</select>':badge(r.status))+'</td><td class="tag">'+r.at+'</td><td class="right">'+(hr?'<button class="btn no sm" data-del-r="'+r.id+'">지우기</button>':'')+'</td></tr>'}).join('')+'</table>':'<div class="empty">신청이 없습니다</div>');
 if(tab==='hist'){const rows=[];st.reqs.forEach(r=>r.hist.forEach(h=>rows.push([h.at,r.id,(person(r.no)||{}).name,r.type,h.who,h.act,h.memo])));rows.sort((a,b)=>a[0]<b[0]?1:-1);
  body+=card2('결재 이력 '+rows.length+'줄','고치거나 지울 수 없습니다 (기록 보존)',rows.length?'<table><tr><th>시각</th><th>신청 번호</th><th>신청자</th><th>종류</th><th>처리자</th><th>처리</th><th>메모</th></tr>'+rows.map(x=>'<tr>'+x.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>':'<div class="empty">이력이 없습니다</div>')}
 if(tab==='depts')body+=card2('부서 '+st.depts.length+'개','이름을 고치면 소속 인원도 같이 바뀝니다 · 인원이 있는 부서는 지울 수 없습니다',
  '<table><tr><th>부서</th><th class="right">인원</th><th></th></tr>'+st.depts.map((d,i)=>{const n=st.people.filter(p=>p.dept===d).length;return '<tr><td>'+(hr?'<input class="fld" data-dn="'+i+'" value="'+esc(d)+'">':esc(d))+'</td><td class="right">'+n+'</td><td class="right">'+(hr&&!n?'<button class="btn no sm" data-dd="'+i+'">지우기</button>':'')+'</td></tr>'}).join('')+'</table>'+
  (hr?'<div style="margin-top:10px;display:flex;gap:6px"><input class="fld" id="dnew" placeholder="새 부서 이름"><button class="btn p sm" id="dadd">부서 추가</button></div>':''));
body+=dataMore(tab,hr);
 if(tab==='backup')body+=card2('백업·가져오기','이 브라우저에만 저장됩니다. 다른 PC로 옮기려면 내보낸 파일을 거기서 가져오세요',
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" id="xjson">전체 내보내기 (JSON)</button><button class="btn" id="xcsv1">인원 CSV</button><button class="btn" id="xcsv2">근태 신청 CSV</button>'+(hr?'<label class="btn">가져오기 (JSON)<input type="file" id="ijson" accept=".json" style="display:none"></label>':'')+'</div>'+
  '<div class="tag" style="margin-top:10px">지금 저장된 것: 인원 '+st.people.length+' · 근태 신청 '+st.reqs.length+' · 부서 '+st.depts.length+'</div>');
 return '<div class="top"><h1>데이터 관리</h1><span class="tag">SharePoint 목록 구조(스키마 v0.4)와 같은 묶음</span></div><div class="tabs">'+DT.map(t=>'<a href="#data/'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</a>').join('')+'</div>'+body}
function card2(t,d,b){return '<section class="card"><div class="hd"><b>'+t+'</b><span class="tag">'+d+'</span></div><div class="bd" style="overflow-x:auto">'+b+'</div></section>'}
function ed(no,k,v,ty){return st.role==='hr'?'<input class="fld" type="'+ty+'" data-pe="'+no+'" data-k="'+k+'" value="'+esc(v)+'">':esc(v)}
function sel(no,k,v,opts){return st.role==='hr'?'<select class="fld" data-pe="'+no+'" data-k="'+k+'">'+opts.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':esc(v)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function twice(b){if(b.dataset.c)return true;b.dataset.c=1;b.textContent='한 번 더 누르기';setTimeout(()=>{delete b.dataset.c;b.textContent='지우기'},3000);return false}
function wireData(){
 const th=$('#tohr3');if(th)th.onclick=()=>switchRole('hr');
 document.querySelectorAll('[data-pe]').forEach(e=>e.onchange=()=>{const p=person(e.dataset.pe),k=e.dataset.k,v=e.value.trim();if(!v){e.value=p[k];return}
  p[k]=v;if(k==='status'&&v==='퇴직')p.leftAt=today();save();toast(p.name+' 저장했습니다');nav('data');guide()});
 document.querySelectorAll('[data-del-p]').forEach(b=>b.onclick=()=>{if(!twice(b))return;st.people=st.people.filter(p=>p.no!==b.dataset.delP);if(st.me===b.dataset.delP)st.me='';save();render()});
 document.querySelectorAll('[data-rs]').forEach(e=>e.onchange=()=>{const r=st.reqs.find(x=>x.id===+e.dataset.rs),old=r.status;r.status=e.value;act(r,'인사','인사 수정: '+old+' → '+r.status);save();toast('상태를 바꿨습니다');render()});
 document.querySelectorAll('[data-del-r]').forEach(b=>b.onclick=()=>{if(!twice(b))return;st.reqs=st.reqs.filter(r=>r.id!==+b.dataset.delR);save();render()});
 document.querySelectorAll('[data-dn]').forEach(e=>e.onchange=()=>{const i=+e.dataset.dn,o=st.depts[i],v=e.value.trim();if(!v||st.depts.includes(v)){e.value=o;return}st.depts[i]=v;st.people.forEach(p=>{if(p.dept===o)p.dept=v});save();toast(o+' → '+v);render()});
 document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{st.depts.splice(+b.dataset.dd,1);save();render()});
 const da=$('#dadd');if(da)da.onclick=()=>{const v=$('#dnew').value.trim();if(!v||st.depts.includes(v))return;st.depts.push(v);save();render();toast(v+' 부서를 추가했습니다')};
 const xj=$('#xjson');if(xj){xj.onclick=()=>dl('hurom-ehr-'+today()+'.json',JSON.stringify({people:st.people,reqs:st.reqs,depts:st.depts,seq:st.seq,pseq:st.pseq},null,1),'application/json');
  $('#xcsv1').onclick=()=>dl('EHR_인원.csv',csv([['사번','이름','부서','직책','직급','입사일','고용','상태','발생','사용','예약','잔여']].concat(st.people.map(p=>{const b=bal(p.no);return [p.no,p.name,p.dept,p.pos,p.grade,p.join,p.emp,p.status,b.grant,b.used,b.res,b.rem]}))),'text/csv');
  $('#xcsv2').onclick=()=>dl('EHR_근태신청.csv',csv([['번호','사번','이름','종류','시작','끝','일수','사유','상태','신청시각']].concat(st.reqs.map(r=>[r.id,r.no,(person(r.no)||{}).name,r.type,r.from,r.to,r.days,r.reason,r.status,r.at]))),'text/csv')}
 const ij=$('#ijson');if(ij)ij.onchange=()=>{const f=ij.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t.replace(/^﻿/,''));if(!Array.isArray(d.people)||!Array.isArray(d.reqs))throw 0;
  Object.assign(st,{people:d.people,reqs:d.reqs,depts:d.depts||st.depts,seq:d.seq||st.seq,pseq:d.pseq||st.pseq});save();toast('가져왔습니다: 인원 '+d.people.length+' · 신청 '+d.reqs.length);render()}catch(e){toast('파일 형식이 맞지 않습니다')}})}}

/* ---------- 그리기·이벤트 ---------- */
function render(){
 const h=(location.hash||'#dash').slice(1).split('/');const page=V[h[0]]?h[0]:'dash';
 SIMD=st.simDate||'';autoRun();nav(page);bar();guide();ensureTasks();bell();const v=$('#view');v.classList.remove('view');void v.offsetWidth;v.classList.add('view');v.innerHTML=V[page](h[1]);wire(page);wireReset();if(page==='reorg')wireReorg();wireAuto();wirePerm();window.scrollTo(0,0)}
function wire(page){
 document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>location.hash=e.dataset.go);
 const th=$('#tohr')||$('#tohr2');if(th)th.onclick=()=>switchRole('hr','#people');
 const cs=$('#c_sel');if(cs)cs.onchange=()=>location.hash='#card/'+cs.value;
 document.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{const p=person((location.hash.split('/')[1])||st.people[0].no);p.status=b.dataset.ps;if(p.status==='퇴직')p.leftAt=today();save();toast(p.name+' 상태를 '+p.status+'(으)로 바꿨습니다');render()});
 const add=$('#p_add');if(add)add.onclick=()=>{const name=$('#p_name').value.trim();if(!name){$('#p_err').textContent='이름을 넣으세요';return}
  const join=$('#p_join').value;if(!join){$('#p_err').textContent='입사일을 고르세요';return}
  const old=st.people.find(x=>x.status==='퇴직'&&x.name===name);if(old&&!add.dataset.force){$('#p_err').innerHTML='예전 퇴사자 '+esc(old.name)+'('+old.no+', '+old.join+' ~ '+old.leftAt+(old.leftReason?', '+esc(old.leftReason):'')+', 재입사 '+esc(old.rehireOk||'검토 필요')+')와 이름이 같습니다. <a class="btn sm p" href="#card/'+old.no+'">재입사로 처리</a> <button class="btn sm" id="p_force">다른 사람 — 새로 등록</button>';$('#p_force').onclick=()=>{add.dataset.force=1;add.click()};return}delete add.dataset.force;
  if($('#p_emp').value==='계약'&&!$('#p_ctend').value){$('#p_err').textContent='계약직은 계약 종료일을 넣으세요';return}
  const no='H'+String(st.pseq++).padStart(4,'0');st.people.push({cl:$('#p_emp').value==='정규'?'LV1':'',ctEnd:$('#p_ctend').value||'',no,name,dept:$('#p_dept').value,pos:$('#p_pos').value,grade:$('#p_grade').value,join,emp:$('#p_emp').value,status:'재직',base:+$('#p_base').value||0,allow:+$('#p_allow').value||0});addMove(no,'입사',join,'신규 입사');
  if(!st.me)st.me=no;save();render();toast(name+' 등록했습니다 (사번 '+no+')','직원 '+name+'(으)로 신청하기',()=>{st.me=no;switchRole('emp','#leave/new')})};
 const ty=$('#types');if(ty){
  const upd=()=>{draft.from=$('#f_from').value;draft.to=$('#f_to').value;draft.reason=$('#f_reason').value;const d=calcDays();$('#f_days').value=TYPES[draft.type].deduct?d+'일':d+'일 (연차 차감 없음)';$('#f_err').textContent=validate()};
  ty.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.type=b.dataset.t;draft.from=$('#f_from').value;draft.to=$('#f_to').value;draft.reason=$('#f_reason').value;render()});
  ['#f_from','#f_to','#f_reason'].forEach(s=>$(s).oninput=upd);upd();
  $('#f_send').onclick=()=>{const e=validate();if(e){$('#f_err').textContent=e;return}const p=person(st.me),tyd=TYPES[draft.type],f=$('#f_from').value,t=tyd.days===0.5?f:$('#f_to').value;
   const r={id:st.seq++,no:p.no,type:draft.type,from:f,to:t,days:calcDays(),reason:$('#f_reason').value.trim(),status:S.LEAD,at:now(),retro:f<today(),hist:[]};
   act(r,p.name,'신청');st.reqs.push(r);draft={type:'연차'};save();
   toast(p.name+' '+r.type+' 신청했습니다 → '+stepName(r)+' 대기','팀장으로 승인하기',()=>switchRole('lead','#leave/approve'));location.hash='#leave/mine';render()}}
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>doAct(b.dataset.a,+b.dataset.id));if(page==='data')wireData();wireMods(page);wireMods2(page);wireMods3(page);wireMods4(page);if(page==='erp')wireErp()}
function doAct(a,id){
 const r=st.reqs.find(x=>x.id===id);if(!r)return;const p=person(r.no)||{};const sn=stepName(r).replace(' 승인','');let msg='',nb='',go=null;
 const memo=(a==='no'||a==='hrno'||a==='clno')?prompt2():'';
 if(a==='ok'){r.status=S.HR;act(r,apv(r,sn),sn+' 승인 (연차 예약)');msg='승인했습니다 → 인사 확정 대기';nb='인사로 확정하기';go=()=>switchRole('hr','#leave/hr')}
 if(a==='no'){r.status=S.NO;act(r,apv(r,sn),sn+' 반려',memo);msg='반려했습니다';nb='직원 화면 보기';go=()=>{st.me=r.no;switchRole('emp','#leave/mine')}}
 if(a==='hrok'){r.status=S.OK;act(r,'인사','인사 확정 (연차 사용)');msg='확정했습니다 → 연차 사용으로 반영';nb='인사카드 보기';go=()=>location.hash='#card/'+r.no}
 if(a==='hrno'){r.status=S.NO;act(r,'인사','인사 반려',memo);msg='반려했습니다 → 예약 풀림'}
 if(a==='wd'){r.status=S.WD;act(r,p.name,'회수');msg='회수했습니다'}
 if(a==='cl'){r.status=S.CL;act(r,p.name,'취소 요청');msg='취소 요청했습니다 → '+sn+' 대기';nb='팀장으로 처리하기';go=()=>switchRole('lead','#leave/approve')}
 if(a==='clok'){r.status=S.CH;act(r,sn,'취소 '+sn+' 승인');msg='취소를 승인했습니다 → 인사 확정 대기';nb='인사로 확정하기';go=()=>switchRole('hr','#leave/hr')}
 if(a==='clno'){r.status=S.OK;act(r,sn,'취소 반려',memo);msg='취소 요청을 반려했습니다'}
 if(a==='chok'){r.status=S.CX;act(r,'인사','취소 확정 (연차 돌려줌)');msg='취소 확정 → 연차를 돌려줬습니다'}
 if(a==='re'){draft={type:r.type,from:r.from,to:r.to,reason:r.reason};save();location.hash='#leave/new';return}
 save();render();toast((p.name||'')+' '+r.type+': '+msg,nb,go)}
function prompt2(){const v=window.__memo||'';window.__memo='';return v} // 반려 사유는 줄 안 입력창에서 받음
// 반려 사유: 버튼을 누르기 전 같은 줄에 입력창을 띄움
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="no"],[data-a="hrno"],[data-a="clno"]');if(!b||b.dataset.ready)return;
 e.stopImmediatePropagation();e.preventDefault();const td=b.parentElement;const a=b.dataset.a,id=b.dataset.id;
 td.innerHTML='<input class="fld" id="memo" placeholder="반려 사유" style="border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:140px"> <button class="btn no sm" data-a="'+a+'" data-id="'+id+'" data-ready="1">반려</button> <button class="btn sm" id="mcancel">취소</button>';
 const m=td.querySelector('#memo');m.focus();td.querySelector('#mcancel').onclick=()=>render();
 td.querySelector('[data-ready]').onclick=()=>{window.__memo=m.value.trim()||'사유 없음';doAct(a,+id)}},true);
function wireReset(){const rs=$('#reset');if(rs)rs.onclick=()=>{const b=$('#reset');if(b.dataset.c){localStorage.removeItem(KEY);st=blank();draft={type:'연차'};b.textContent='처음부터 다시';delete b.dataset.c;location.hash='#dash';render();toast('처음 상태로 돌렸습니다');return}
 b.dataset.c=1;b.textContent='정말 지울까요? 한 번 더 누르기';b.classList.add('no');setTimeout(()=>{b.textContent='처음부터 다시';delete b.dataset.c;b.classList.remove('no')},4000)}}
window.addEventListener('hashchange',render);render();
})();
</script>
</body></html>
